# CEEC hypothesis beliefs (TODO19 F.2)
# Intervals preferred; method declared; status open until gated.

beliefs:
  - id: B-H1-ADAPTIVE-LOCAL-INVERSES
    statement: >
      Slowly adapting feedback projections improve local credit descent
      quality relative to fixed feedback under matched norm and quick budget.
    type: mechanism
    scope:
      domain: credit
      substrate: [digital, sparse]
      geometry: [feedforward, recurrent]
      credit: [random_projections, target_inversion]
      budget: quick
    probability:
      low: 0.20
      high: 0.60
    uncertainty: high
    evidence_weight: low
    generality: narrow
    status: open

  - id: B-H2-TEMPORAL-PSI-CREDIT
