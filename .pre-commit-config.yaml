repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: pyright
        # Changed library files, the way the two ruff hooks above already are.
        # The gate used to be one hardcoded directory (`computronium/ontology`),
        # so a commit touching any other module was checked by nothing at all
        # (TODO35 §1.2). Tests stay out: 297 findings live in the legacy
        # property suite and a hook that fires on files you only opened is a
        # hook people disable. Findings in an untouched module are Register C
        # hygiene work; findings in a module you changed are yours.
        name: "pyright (changed library files)"
        entry: uv run pyright
        language: system
        files: ^computronium/
        types: [python]
      - id: identity-cards
        name: "identity cards (C.1: every concrete primitive carded)"
        entry: uv run python scripts/generate_identity_cards.py --strict
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-fast
        name: pytest (property tests)
        entry: uv run python -m pytest tests/property/ -q
        language: system
        pass_filenames: false
        always_run: true