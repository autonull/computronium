name: "geometry-coverage"
description: "Exercise all 11 geometries across 4 tasks for full geometry coverage"
tasks: ["digits", "sequential_mnist", "copy_task", "graph_classification"]
budget_seconds: 7200  # 2h total
policy: "round_robin_grid"  # per task
gates: ["dry_run", "property_locks"]
reporters: ["html", "json", "sqlite"]
fidelity: "L1"
n_seeds: 1
epochs: 1
batch_limit: 2
param_budget: 10000
device: "auto"
precision: "fp32"
num_workers: 0
deterministic: false
checkpoint_every_n: 0
# Axis selections to ensure coverage of all 11 geometries
axes:
  - axis: "geometry"
    primitives:
      - "feedforward"
      - "recurrent"
      - "conv"
      - "tile"
      - "tile_mesh"
      - "attention"
      - "causal_transformer"
      - "spatial_lattice"
      - "graph"
      - "nca"
      - "ntm"
  - axis: "dynamics"
    primitives:
      - "energy_minimization"
      - "predictive_settling"
      - "error_predictive_coding"
      - "spike_integration"
      - "instantaneous"
      - "diffusion"
      - "lazy"
      - "pc_alm"
  - axis: "credit"
    primitives:
      - "thermodynamic_contrast"
      - "random_projections"
      - "local_goodness"
      - "local_contrastive"
      - "temporal_trace"
      - "target_inversion"
      - "homeostatic"
      - "pepita"
      - "gradient"
      - "pc_alm"
  - axis: "update"
    primitives:
      - "euclidean"
      - "adam"
      - "muon"
      - "riemannian_orthogonal"
      - "spectral_constrained"
      - "natural_gradient"
      - "elastic_consolidation"
  - axis: "plasticity"
    primitives:
      - "null"
      - "routing"
      - "fast_weights"
      - "substrate_coupled"
      - "rule_state"
      - "temporal_psi"
      - "conflict_adaptive"
  - axis: "substrate"
    primitives:
      - "digital"
      - "analog"
      - "memristive"
      - "neuromorphic"
      - "optical"
      - "quantum"
      - "sparse"
      - "ternary"
      - "complex"
objectives:
  - "validation_accuracy"
  - "walltime_total"
  - "param_count"
  - "flops"
  - "memory_usage"
  - "energy_per_step"
  - "spectral_radius"
  - "stability_margin"
  - "nonnormality"
  - "settle_steps"
  - "psi_capacity"
  - "consolidation_cost"
  - "rewrite_rate"
  - "energy_efficiency"