<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="Computronium: an epistemic laboratory for learning systems. Slides, reference documentation, and the architecture cheatsheet.">
<style>
:root{
  --bar-h:56px;
  --bg:#0a0e14; --bg-2:#0e141c; --panel:#131b25; --panel-2:#182230;
  --text:#e6edf3; --muted:#94a3b8; --faint:#64748b;
  --rule:#223041; --rule-2:#2e4054;
  --accent:#58a6ff; --accent-2:#3fb950; --warn:#d29922; --pink:#f778ba;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,monospace;
  --radius:14px; --shadow:0 26px 70px #0009;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f7f9fc; --bg-2:#eef3f9; --panel:#ffffff; --panel-2:#f1f5fa;
  --text:#17202b; --muted:#4d5e72; --faint:#6b7c90;
  --rule:#d7e0eb; --rule-2:#c3cfdd;
  --accent:#0969da; --accent-2:#1a7f37; --warn:#9a6700; --pink:#bf3989;
  --shadow:0 26px 70px #25364a22;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100dvh; background:
    radial-gradient(1100px 760px at 12% -8%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 62%),
    radial-gradient(900px 700px at 108% 6%, color-mix(in srgb, var(--accent-2) 8%, transparent), transparent 58%),
    var(--bg);
  color:var(--text); font-family:var(--sans);
  font-size:clamp(.98rem,.35vw + .9rem,1.06rem); line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{background:color-mix(in srgb, var(--accent) 32%, transparent)}
a{color:var(--accent); text-underline-offset:.18em}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px}
.icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--panel);color:var(--text);padding:.5rem .8rem;border-radius:8px;border:1px solid var(--rule);transition:top .15s}
.skip:focus{top:10px}

/* ---------- bar ---------- */
.bar{
  position:fixed; inset:0 0 auto 0; z-index:50; height:var(--bar-h);
  display:flex; align-items:center; gap:.65rem;
  padding:0 clamp(.7rem,2vw,1.4rem);
  font:500 .78rem/1 var(--mono); color:var(--muted);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(16px) saturate(1.25);
  border-bottom:1px solid var(--rule);
}
.brand{display:flex;align-items:center;gap:.55rem;color:var(--text);text-decoration:none;font-weight:650;letter-spacing:.01em;margin-right:.2rem;white-space:nowrap}
.brand-mark{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent),0 0 22px var(--accent)}
.brand-name{font-family:var(--sans);font-size:.92rem}
.tabs{display:flex;align-items:stretch;gap:2px;height:100%;margin-left:.4rem}
.tab{
  position:relative;display:flex;align-items:center;gap:.45rem;
  color:var(--muted);text-decoration:none;padding:0 .7rem;
  border-radius:8px;transition:color .15s,background .15s;white-space:nowrap;
}
.tab:hover{color:var(--text);background:color-mix(in srgb, var(--panel) 70%, transparent)}
.tab[aria-selected="true"]{color:var(--text);background:color-mix(in srgb, var(--accent) 12%, transparent)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:.55rem;right:.55rem;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.tab .icon{width:15px;height:15px}
.count{margin-left:auto;margin-right:.4rem;font-variant-numeric:tabular-nums;color:var(--faint);white-space:nowrap}
.actions{display:flex;align-items:center;gap:.3rem;margin-left:auto}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;padding:0;border-radius:8px;
  color:var(--muted);background:transparent;border:1px solid transparent;
  cursor:pointer;transition:color .15s,background .15s,border-color .15s;
}
.icon-btn:hover{color:var(--text);background:var(--panel);border-color:var(--rule)}
.icon-btn:disabled{opacity:.3;cursor:not-allowed}
.seg{display:flex;align-items:center;gap:2px;padding:2px;border-radius:10px;background:color-mix(in srgb, var(--panel) 60%, transparent);border:1px solid var(--rule)}
.seg .icon-btn{width:30px;height:28px;border:0}
.seg .icon-btn[aria-pressed="true"]{color:var(--bg);background:var(--accent)}
body:not([data-set="about"]) .reading-only,
body:not([data-set="about"]) .count{display:none}
body.reading .count{display:none}

/* ---------- sets ---------- */
main{padding-top:var(--bar-h)}
.set{display:none}
body[data-set="about"] #set-about,
body[data-set="docs"] #set-docs,
body[data-set="cheatsheet"] #set-cheatsheet{display:block}

/* ---------- about deck ---------- */
#set-about{height:calc(100dvh - var(--bar-h))}
#deck{
  height:100%; overflow-y:auto; overflow-x:hidden;
  scroll-snap-type:y mandatory; scrollbar-width:thin; scroll-behavior:smooth;
}
#deck .slide{
  height:100%; scroll-snap-align:start; scroll-snap-stop:always;
  display:grid; place-items:center;
  padding:clamp(2.9rem,5vh,3.6rem) clamp(1.4rem,7vw,7rem) clamp(1.4rem,3.5vh,2.2rem);
}
.stage{width:100%;max-width:76rem;display:flex;flex-direction:column;gap:.85rem}
.stage > *{width:100%;margin:0}
.stage > .notes-btn{width:auto}
.kicker{
  font:600 .74rem/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);display:flex;align-items:center;gap:.7rem;
}
.kicker::after{content:"";flex:1;height:1px;background:var(--rule);max-width:10rem}
.notes-btn{
  align-self:flex-start;font:500 .72rem/1 var(--mono);letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);background:transparent;
  border:1px solid var(--rule);border-radius:6px;padding:.36rem .62rem;cursor:pointer;
}
.notes-btn:hover{color:var(--text);border-color:var(--accent)}
[popover]{
  position:fixed;inset:0;margin:auto;width:min(46rem,92vw);max-height:82vh;
  overflow:auto;padding:1.6rem 1.8rem;border-radius:14px;
  background:var(--panel);color:var(--text);border:1px solid var(--rule);
  font-size:1rem;box-shadow:var(--shadow);
}
[popover]::backdrop{background:#0008;backdrop-filter:blur(3px)}
[popover] > :first-child{margin-top:0}
[popover] > :last-child{margin-bottom:0}
[popover] h2{font-size:1.15rem}

body.reading #set-about{height:auto;min-height:calc(100dvh - var(--bar-h))}
body.reading #deck{
  height:auto;overflow:visible;scroll-snap-type:none;scroll-behavior:auto;
  max-width:60rem;margin:0 auto;padding:4.2rem 1.5rem 7rem;
}
body.reading #deck .slide{
  height:auto;display:block;scroll-snap-align:none;scroll-snap-stop:normal;
  padding:0 0 3.2rem;margin:0 0 3.2rem;border-bottom:1px solid var(--rule);
}
body.reading .stage{max-width:none}
body.reading .kicker::after{display:none}
body.reading .notes-btn{display:none}

/* ---------- shared prose ---------- */
h1,h2,h3,h4{font-weight:640;letter-spacing:-.02em;line-height:1.12;text-wrap:balance}
h1{font-size:clamp(1.7rem,2.9vw,2.6rem)}
h2{font-size:clamp(1.1rem,1.6vw,1.4rem);color:var(--text)}
h3{font:600 .78rem/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h4{font-size:.95rem;color:var(--text)}
p{max-width:70ch}
p:has(> img){max-width:none}
.lead{font-size:clamp(1rem,1.1vw,1.16rem);color:var(--muted);max-width:64ch}
strong{font-weight:660}
em{color:var(--muted);font-style:italic}
hr{border:0;border-top:1px solid var(--rule)}
ul,ol{padding-left:1.15em;max-width:70ch}
li{margin:.32em 0}
li::marker{color:var(--muted)}
blockquote{
  margin:0;padding:.7rem 0 .7rem 1.1rem;border-left:2px solid var(--accent);
  color:var(--muted);font-style:italic;max-width:64ch;
}
blockquote p{margin:0}
code{
  font-family:var(--mono);font-size:.86em;background:var(--panel);
  border:1px solid var(--rule);border-radius:5px;padding:.08em .34em;
}
pre{
  background:var(--panel);border:1px solid var(--rule);border-radius:10px;
  padding:.7rem .9rem;overflow-x:auto;line-height:1.4;
}
pre code{background:none;border:0;padding:0;white-space:pre;font-size:.78rem}
table{border-collapse:collapse;width:100%;margin-top:.2rem;font-size:clamp(.7rem,.5vw + .6rem,.88rem)}
th{
  text-align:left;font:600 .68rem/1.3 var(--mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);padding:.3rem .55rem;
  border-bottom:1px solid var(--rule);white-space:nowrap;
}
td{padding:.28rem .55rem;vertical-align:top;border-bottom:1px solid color-mix(in srgb, var(--rule) 55%, transparent)}
tbody tr:last-child td{border-bottom:0}
td code{white-space:normal}
figure{margin:0}
svg.d{width:100%;height:auto;display:block}
img{display:block;width:100%;border:1px solid var(--rule);border-radius:10px}
figure figcaption{font:500 .72rem/1.4 var(--mono);color:var(--muted);letter-spacing:.06em;margin-top:.5rem}
details{border:1px solid var(--rule);border-radius:10px;background:color-mix(in srgb, var(--panel) 55%, transparent);padding:.7rem .9rem;margin:1rem 0}
summary{cursor:pointer;color:var(--text);font-weight:600}
summary::marker{color:var(--accent)}

.d .node{fill:var(--panel);stroke:var(--rule);stroke-width:1}
.d .hot{fill:color-mix(in srgb, var(--accent) 16%, var(--panel));stroke:var(--accent)}
.d .warm{fill:color-mix(in srgb, var(--warn) 14%, var(--panel));stroke:var(--warn)}
.d .edge{stroke:var(--rule);fill:none;stroke-width:1.2}
.d .flow{stroke:var(--accent);fill:none;stroke-width:1.4}
.d text{fill:var(--text);font-family:var(--mono);font-size:11px}
.d .muted{fill:var(--muted)}
.d .accent{fill:var(--accent)}
.d .tiny{font-size:9px;letter-spacing:.1em}

/* ---------- documentation ---------- */
#set-docs{min-height:calc(100dvh - var(--bar-h))}
.docs-layout{
  display:grid;grid-template-columns:260px minmax(0,1fr);gap:clamp(1.5rem,4vw,4rem);
  max-width:1280px;margin:0 auto;padding:2rem clamp(1rem,3vw,2rem) 8rem;
}
.toc-rail{position:sticky;top:calc(var(--bar-h) + 1.5rem);align-self:start;max-height:calc(100dvh - var(--bar-h) - 3rem);overflow:auto;padding-right:.4rem}
.rail-title{margin:0 0 .7rem;font:600 .68rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.toc{display:flex;flex-direction:column;gap:1px}
.toc a{
  display:flex;align-items:baseline;gap:.6rem;padding:.36rem .55rem;border-radius:7px;
  color:var(--muted);text-decoration:none;font-size:.82rem;line-height:1.3;
  border-left:2px solid transparent;transition:color .15s,background .15s,border-color .15s;
}
.toc a span{font:500 .66rem/1 var(--mono);color:var(--faint);min-width:1.5em}
.toc a:hover{color:var(--text);background:var(--panel)}
.toc a.active{color:var(--text);background:color-mix(in srgb, var(--accent) 10%, transparent);border-left-color:var(--accent)}
.rail-link{display:inline-block;margin-top:1rem;font-size:.78rem;color:var(--muted);text-decoration:none}
.rail-link:hover{color:var(--accent)}
.doc{min-width:0;max-width:780px}
.doc-section{
  padding-bottom:3.2rem;margin-bottom:3.2rem;border-bottom:1px solid var(--rule);
  scroll-margin-top:calc(var(--bar-h) + 1.6rem);
}
.doc-section:last-child{border-bottom:0;margin-bottom:0}
.doc-section > :first-child{margin-top:0}
.doc-section h1{font-size:2rem}
.doc-section h2{font-size:1.35rem;margin-top:2.2rem}
.doc-section h3{font-size:.76rem;margin-top:1.8rem}
.doc-section h4{margin-top:1.4rem}
.doc-section p,.doc-section ul,.doc-section ol,.doc-section blockquote{font-size:.95rem}
.doc-section img{margin:1.1rem 0}
.doc-section [id]{scroll-margin-top:calc(var(--bar-h) + 1.4rem)}
.doc-section a{overflow-wrap:anywhere}
.doc-section table{display:block;overflow-x:auto;white-space:nowrap}
.doc-section td code{white-space:normal}

/* ---------- cheatsheet / map ---------- */
#set-cheatsheet{height:calc(100dvh - var(--bar-h))}
.map-layout{display:grid;grid-template-columns:290px minmax(0,1fr);height:100%}
.map-index{overflow:auto;padding:1.2rem 1rem;border-right:1px solid var(--rule);background:color-mix(in srgb, var(--bg-2) 70%, transparent)}
.map-hint{margin:0 0 .9rem;font-size:.76rem;line-height:1.45;color:var(--faint);max-width:none}
.map-list{display:flex;flex-direction:column;gap:.35rem}
.map-item{display:flex;align-items:stretch;gap:.25rem;border-radius:10px;border:1px solid transparent;transition:background .15s,border-color .15s}
.map-item:hover{background:var(--panel);border-color:var(--rule)}
.map-item.is-active{background:color-mix(in srgb, var(--accent) 12%, transparent);border-color:color-mix(in srgb, var(--accent) 45%, var(--rule))}
.map-zoom{flex:1;display:flex;flex-direction:column;gap:.12rem;align-items:flex-start;text-align:left;padding:.5rem .6rem;border:0;border-radius:9px;background:transparent;color:var(--text);cursor:pointer;font:inherit}
.map-item-title{font-size:.82rem;font-weight:560;line-height:1.25}
.map-item-sub{font:500 .63rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.map-doc{display:flex;align-items:center;justify-content:center;width:34px;color:var(--faint);text-decoration:none;border-radius:9px}
.map-doc:hover{color:var(--accent);background:var(--panel-2)}
.map-main{position:relative;overflow:hidden;background:
  linear-gradient(color-mix(in srgb, var(--rule) 42%, transparent) 1px, transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg, color-mix(in srgb, var(--rule) 42%, transparent) 1px, transparent 1px) 0 0/24px 24px,
  var(--bg-2);}
.map-viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none}
.map-viewport:active{cursor:grabbing}
.map-canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.map-canvas > svg{display:block;width:auto;height:auto;border-radius:10px;background:#fff;box-shadow:var(--shadow)}
.map-canvas g[data-panel]{cursor:pointer;transition:opacity .18s}
.map-canvas.has-active g[data-panel]{opacity:.22}
.map-canvas.has-active g[data-panel].is-active{opacity:1}
.map-canvas g[data-panel]:hover > rect:first-of-type,
.map-canvas g[data-panel]:focus-visible > rect:first-of-type{stroke:var(--accent) !important;stroke-width:3.4 !important}
.map-toolbar{
  position:absolute;left:50%;bottom:1rem;transform:translateX(-50%);
  display:flex;align-items:center;gap:.15rem;padding:.3rem;
  border-radius:12px;border:1px solid var(--rule);
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:blur(12px);box-shadow:var(--shadow);z-index:2;
}
.map-toolbar button,.map-toolbar a{
  display:inline-flex;align-items:center;justify-content:center;gap:.35rem;
  min-width:32px;height:30px;padding:0 .5rem;border:0;border-radius:8px;
  background:transparent;color:var(--muted);font:500 .72rem/1 var(--mono);
  text-decoration:none;cursor:pointer;
}
.map-toolbar button:hover,.map-toolbar a:hover{color:var(--text);background:var(--panel-2)}
.map-toolbar .zoom-level{min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums;color:var(--faint)}

/* ---------- palette ---------- */
dialog.palette{
  width:min(44rem,94vw);max-height:min(34rem,84vh);padding:0;border:1px solid var(--rule);
  border-radius:16px;background:var(--panel);color:var(--text);box-shadow:var(--shadow);
}
dialog.palette::backdrop{background:#000a;backdrop-filter:blur(4px)}
.palette-head{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;border-bottom:1px solid var(--rule);color:var(--faint)}
.palette-head input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:500 1rem/1.2 var(--sans);outline:none}
.palette-head input::placeholder{color:var(--faint)}
kbd{font:500 .66rem/1 var(--mono);color:var(--faint);border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:.18rem .32rem;background:var(--panel-2)}
.palette-results{max-height:26rem;overflow:auto;padding:.4rem}
.palette-item{
  display:flex;flex-direction:column;gap:.12rem;width:100%;text-align:left;
  padding:.5rem .65rem;border:0;border-radius:8px;background:transparent;color:var(--text);
  cursor:pointer;font:inherit;
}
.palette-item:hover,.palette-item.is-selected{background:color-mix(in srgb, var(--accent) 14%, transparent)}
.pi-title{font-size:.88rem;font-weight:560}
.pi-meta{font:500 .64rem/1.1 var(--mono);letter-spacing:.05em;color:var(--faint)}
.palette-empty{margin:1rem;color:var(--faint);font-size:.85rem}
.palette-foot{display:flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border-top:1px solid var(--rule);color:var(--faint);font:500 .66rem/1 var(--mono)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .docs-layout{display:block;padding-top:1rem}
  .toc-rail{position:static;max-height:none;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--rule)}
  .toc{flex-direction:row;flex-wrap:wrap;gap:.2rem}
  .toc a{border-left:0;border-bottom:2px solid transparent}
  .toc a.active{border-left:0;border-bottom-color:var(--accent)}
  .doc{max-width:none}
  .map-layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .map-index{max-height:32vh;border-right:0;border-bottom:1px solid var(--rule)}
  .map-list{flex-direction:row;flex-wrap:wrap}
  .map-item{flex:1 1 12rem}
}
@media (max-width:640px){
  .brand-name{display:none}
  .tab span{display:none}
  .tab{padding:0 .55rem}
  .count{display:none}
  .bar{gap:.35rem}
}

/* ---------- print: the current set only ---------- */
@media print{
  @page{size:A4 landscape;margin:10mm}
  html[data-theme]{
    --bg:#fff;--bg-2:#fff;--panel:#f5f5f5;--panel-2:#eee;
    --text:#111;--muted:#555;--faint:#666;--rule:#bbb;--rule-2:#aaa;
    --accent:#0b5cad;--accent-2:#1a7f37;--warn:#8a5a00;--shadow:none;
  }
  body{background:#fff;font-size:12pt}
  .bar,.toc-rail,.map-index,.map-toolbar,dialog,.skip,.notes-btn{display:none !important}
  main{padding-top:0}
  .set{display:none !important}
  body[data-set="about"] #set-about,
  body[data-set="docs"] #set-docs,
  body[data-set="cheatsheet"] #set-cheatsheet{display:block !important}
  #set-about,#set-docs,#set-cheatsheet{height:auto}
  #deck{height:auto;overflow:visible;scroll-snap-type:none;max-width:none;padding:0;margin:0}
  #deck .slide{height:auto;display:block;page-break-after:always;break-after:page;padding:0 0 6mm;margin:0;border:0}
  #deck .slide:last-child{page-break-after:auto;break-after:auto}
  .stage{max-width:none;zoom:1 !important}
  .docs-layout{display:block;max-width:none;padding:0;margin:0}
  .doc{max-width:none}
  .doc-section{border:0;margin:0;padding:0 0 6mm}
  .doc-section h2,.doc-section h3{page-break-after:avoid;break-after:avoid}
  pre,table,blockquote,figure{page-break-inside:avoid;break-inside:avoid}
  .doc-section table{display:table;white-space:normal}
  .map-layout{display:block;height:auto}
  .map-main{background:#fff;overflow:visible}
  .map-viewport{position:static;inset:auto;height:auto;overflow:visible}
  .map-canvas{position:static;transform:none !important}
  .map-canvas > svg{width:100%;height:auto;max-height:180mm;box-shadow:none;border-radius:0}
  a{color:inherit;text-decoration:none}
}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto !important;transition-duration:0s !important;animation-duration:0s !important}
}
</style>
</head>
<body data-set="about">
<a class="skip" href="#main">Skip to content</a>

<svg class="sprite" aria-hidden="true" focusable="false">

  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></symbol>

<script type="application/json" id="site-index">{{site_index}}</script>
<script type="application/json" id="map-manifest">{{map_manifest}}</script>
<script>
(() => {
  "use strict";

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
  const body = document.body;
  const root = document.documentElement;
  const bar = $(".bar");
  const deck = $("#deck");
  const slides = $$("#deck .slide");
  const counter = $("#count");
  const notesBtn = $("#notes");
  const themeIcon = $("#theme-icon");
  const presentBtn = $("#mode-present");
  const readBtn = $("#mode-read");
  const viewport = $("#map-viewport");
  const canvas = $("#map-canvas");
  const zoomLevel = $("#zoom-level");

  const sets = new Set(["about", "docs", "cheatsheet"]);
  const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
  const pad = (value) => String(value).padStart(2, "0");
  const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[char]);

  let current = 0;
  let reading = false;

  /* ---------------- routing ---------------- */

  function parseRoute() {
    const raw = location.hash.replace(/^#\/?/, "");
    const [candidate, ...rest] = raw.split("/");
    if (!sets.has(candidate)) {
      return { set: body.dataset.set || "about", item: location.hash.slice(1), plain: true };
    }
    return { set: candidate, item: rest.join("/"), plain: false };
  }

  function navigate(set, item) {
    const hash = item ? `#/${set}/${item}` : `#/${set}`;
    if (location.hash === hash) {
      applyRoute();
    } else {
      location.hash = hash;
    }
  }

  /* ---------------- about set ---------------- */

  function updateCounter() {
    if (!slides.length) return;
    counter.textContent = `${pad(current + 1)} / ${pad(slides.length)}`;
    const panel = slides[current]?.querySelector("[popover]");
    notesBtn.disabled = !panel || reading;
  }

  function goSlide(index, { smooth = true, hash = true } = {}) {
    if (!slides.length) return;
    const target = slides[clamp(index, 0, slides.length - 1)];
    current = slides.indexOf(target);
    target.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
    if (hash) history.replaceState(null, "", `#/about/${target.id}`);
    updateCounter();
  }

  function nearestSlide() {
    const middle = window.innerHeight / 2;
    let best = 0;
    let distance = Infinity;
    slides.forEach((slide, index) => {
      const box = slide.getBoundingClientRect();
      const centre = box.top + Math.min(box.height, window.innerHeight) / 2;
      const currentDistance = Math.abs(centre - middle);
      if (currentDistance < distance) { distance = currentDistance; best = index; }
    });
    return best;
  }

  function spySlides() {
    if (body.dataset.set !== "about") return;
    const index = nearestSlide();
    if (index !== current) {
      current = index;
      updateCounter();
      history.replaceState(null, "", `#/about/${slides[index].id}`);
    }
  }

  function setReading(next) {
    reading = next;
    body.classList.toggle("reading", reading);
    presentBtn.setAttribute("aria-pressed", String(!reading));
    readBtn.setAttribute("aria-pressed", String(reading));
    notesBtn.disabled = reading || !slides[current]?.querySelector("[popover]");
    requestAnimationFrame(() => {
      if (!reading) goSlide(current, { smooth: false, hash: false });
      fit();
    });
  }

  function openNotes() {
    const panel = slides[current]?.querySelector("[popover]");
    if (panel?.showPopover) panel.showPopover();
  }

  function fitStage(stage) {
    stage.style.zoom = "";
    const section = stage.parentElement;
    const style = getComputedStyle(section);
    const available = section.clientHeight
      - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    if (available <= 0) return;
    let zoom = 1;
    for (let pass = 0; pass < 4; pass += 1) {
      const height = stage.getBoundingClientRect().height;
      if (height <= available * 0.999) return;
      zoom = Math.max(0.5, zoom * (available / height) * 0.99);
      stage.style.zoom = String(zoom);
    }
  }

  function fit() {
    $$(".stage").forEach((stage) => {
      if (!stage) return;
      if (reading) { stage.style.zoom = ""; return; }
      fitStage(stage);
    });
  }

  /* ---------------- documentation ---------------- */

  function updateTocActive() {
    if (body.dataset.set !== "docs") return;
    const offset = bar.offsetHeight + 48;
    let best = "";
    $$(".doc-section").forEach((section) => {
      if (section.getBoundingClientRect().top <= offset) {
        best = section.id.replace(/^docs-/, "");
      }
    });
    if (!best) best = $(".doc-section")?.id.replace(/^docs-/, "") || "";
    $$(".toc a").forEach((link) => {
      link.classList.toggle("active", link.dataset.doc === best);
      if (link.dataset.doc === best) link.setAttribute("aria-current", "true");
      else link.removeAttribute("aria-current");
    });
  }

  function scrollDoc(key, heading, { smooth = true } = {}) {
    const target = heading
      ? document.getElementById(`docs-h-${heading}`)
      : document.getElementById(`docs-${key}`);
    if (!target) return;
    target.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
    updateTocActive();
  }

  /* ---------------- cheatsheet ---------------- */

  const mapManifest = JSON.parse($("#map-manifest").textContent);
  const panels = new Map(mapManifest.panels.map((panel) => [panel.key, panel]));
  const mapBox = { x: 0, y: 0, w: mapManifest.canvas.width, h: mapManifest.canvas.height };
  let view = { x: 0, y: 0, scale: 1 };
  let baseScale = 1;
  let activePanel = null;
  let drag = null;

  const viewportSize = () => ({ w: viewport.clientWidth, h: viewport.clientHeight });

  function fitTransform(box, margin = 24, maxScale = Infinity) {
    const { w, h } = viewportSize();
    if (w <= 0 || h <= 0) return { x: 0, y: 0, scale: 1 };
    const scale = Math.min((w - margin * 2) / box.w, (h - margin * 2) / box.h, maxScale);
    return {
      scale,
      x: w / 2 - (box.x + box.w / 2) * scale,
      y: h / 2 - (box.y + box.h / 2) * scale,
    };
  }

  function setView(next, { animate = true } = {}) {
    view = next;
    canvas.style.transition = animate ? "transform .5s cubic-bezier(.22,.61,.36,1)" : "none";
    canvas.style.transform = `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.scale})`;
    updateZoomLabel();
  }

  function updateZoomLabel() {
    const value = baseScale > 0 ? Math.round((view.scale / baseScale) * 100) : 100;
    zoomLevel.textContent = `${value}%`;
  }

  function setActive(key) {
    activePanel = key;
    canvas.classList.toggle("has-active", Boolean(key));
    $$("g[data-panel]", canvas).forEach((group) => {
      group.classList.toggle("is-active", group.dataset.panel === key);
    });
    $$(".map-item").forEach((item) => {
      item.classList.toggle("is-active", item.dataset.mapKey === key);
    });
  }

  function fitMap({ instant = true } = {}) {
    const { w, h } = viewportSize();
    const margin = Math.max(12, Math.min(w, h) * 0.035);
    const next = fitTransform(mapBox, margin);
    baseScale = next.scale;
    setActive(null);
    setView(next, { animate: !instant });
  }

  function zoomPanel(key, { instant = false } = {}) {
    setActive(key);
    if (!key) { fitMap({ instant }); return; }
    const panel = panels.get(key);
    if (!panel) { fitMap({ instant }); return; }
    const next = fitTransform(panel, 56, 2.4);
    setView(next, { animate: !instant });
  }

  function zoomBy(factor, cx, cy) {
    const { w, h } = viewportSize();
    const centreX = cx ?? w / 2;
    const centreY = cy ?? h / 2;
    const scale = clamp(view.scale * factor, 0.02, 3);
    const worldX = (centreX - view.x) / view.scale;
    const worldY = (centreY - view.y) / view.scale;
    setView({
      x: centreX - worldX * scale,
      y: centreY - worldY * scale,
      scale,
    }, { animate: false });
  }

  if (viewport) {
    viewport.addEventListener("wheel", (event) => {
      if (body.dataset.set !== "cheatsheet") return;
      event.preventDefault();
      const rect = viewport.getBoundingClientRect();
      zoomBy(Math.exp(-event.deltaY * 0.0015), event.clientX - rect.left, event.clientY - rect.top);
    }, { passive: false });

    viewport.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      drag = {
        id: event.pointerId,
        sx: event.clientX,
        sy: event.clientY,
        ox: view.x,
        oy: view.y,
        moved: 0,
        panel: event.target.closest?.("g[data-panel]")?.dataset.panel || null,
      };
      viewport.setPointerCapture(event.pointerId);
    });

    viewport.addEventListener("pointermove", (event) => {
      if (!drag || event.pointerId !== drag.id) return;
      const dx = event.clientX - drag.sx;
      const dy = event.clientY - drag.sy;
      drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
      if (drag.moved > 3) {
        setView({ x: drag.ox + dx, y: drag.oy + dy, scale: view.scale }, { animate: false });
      }
    });

    const endDrag = (event) => {
      if (!drag) return;
      const panel = drag.panel;
      const moved = drag.moved;
      drag = null;
      if (event.pointerId !== undefined && viewport.hasPointerCapture?.(event.pointerId)) {
        viewport.releasePointerCapture(event.pointerId);
      }
      if (moved < 5 && panel) navigate("cheatsheet", panel);
    };
    viewport.addEventListener("pointerup", endDrag);
    viewport.addEventListener("pointercancel", () => { drag = null; });

    viewport.addEventListener("dblclick", () => navigate("cheatsheet"));

    viewport.addEventListener("keydown", (event) => {
      const group = event.target.closest?.("g[data-panel]");
      if (!group) return;
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        navigate("cheatsheet", group.dataset.panel);
      }
    });
  }

  $("#zoom-in")?.addEventListener("click", () => zoomBy(1.3));
  $("#zoom-out")?.addEventListener("click", () => zoomBy(1 / 1.3));
  $("#map-reset")?.addEventListener("click", () => navigate("cheatsheet"));
  $$("[data-map-target]").forEach((button) => {
    button.addEventListener("click", () => navigate("cheatsheet", button.dataset.mapTarget));
  });

  function refitMap() {
    if (body.dataset.set !== "cheatsheet") return;
    if (activePanel) zoomPanel(activePanel, { instant: true });
    else fitMap({ instant: true });
  }

  /* ---------------- set activation ---------------- */

  function activateSet(set) {
    body.dataset.set = set;
    $$(".tab").forEach((tab) => {
      const selected = tab.dataset.set === set;
      tab.setAttribute("aria-selected", String(selected));
      tab.tabIndex = selected ? 0 : -1;
    });
    const about = set === "about";
    presentBtn.disabled = !about;
    readBtn.disabled = !about;
    if (about) {
      notesBtn.disabled = reading || !slides[current]?.querySelector("[popover]");
    } else {
      notesBtn.disabled = true;
    }
    if (set === "docs") updateTocActive();
    if (set === "cheatsheet") requestAnimationFrame(refitMap);
  }

  function applyRoute({ instant = false } = {}) {
    const route = parseRoute();
    activateSet(route.set);
    if (route.plain && route.item) {
      const element = document.getElementById(route.item);
      if (element) {
        element.scrollIntoView({ behavior: instant ? "auto" : "smooth", block: "start" });
        return;
      }
    }
    if (route.set === "about") {
      const index = slides.findIndex((slide) => slide.id === route.item);
      goSlide(index >= 0 ? index : 0, { smooth: !instant, hash: false });
    } else if (route.set === "docs") {
      const [key, heading] = route.item.split("/");
      const target = key || $(".doc-section")?.id.replace(/^docs-/, "");
      scrollDoc(target, heading, { smooth: !instant });
    } else {
      requestAnimationFrame(() => zoomPanel(route.item || null, { instant }));
    }
  }

  /* ---------------- palette ---------------- */

  const siteIndex = JSON.parse($("#site-index").textContent);
  const palette = $("#palette");
  const paletteInput = $("#palette-input");
  const paletteResults = $("#palette-results");
  let filtered = [];
  let selected = 0;

  function renderResults(query) {
    const terms = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    filtered = siteIndex.filter((item) => {
      const haystack = [item.title, item.context, item.kind, item.set]
        .filter(Boolean).join(" ").toLowerCase();
      return terms.every((term) => haystack.includes(term));
    }).slice(0, 40);
    selected = clamp(selected, 0, Math.max(0, filtered.length - 1));
    if (!filtered.length) {
      paletteResults.innerHTML = '<p class="palette-empty">No matches.</p>';
      return;
    }
    paletteResults.innerHTML = filtered.map((item, index) => {
      const set = item.set === "about" ? "About" : item.set === "docs" ? "Docs" : "Map";
      const meta = [set, item.kind, item.context].filter(Boolean).join(" · ");
      return `<button type="button" class="palette-item${index === selected ? " is-selected" : ""}" data-index="${index}" role="option" aria-selected="${index === selected}"><span class="pi-title">${escapeHtml(item.title)}</span><span class="pi-meta">${escapeHtml(meta)}</span></button>`;
    }).join("");
  }

  function choose(index) {
    const item = filtered[index];
    if (!item) return;
    palette.close();
    navigate(item.set, item.id);
  }

  function openPalette() {
    paletteInput.value = "";
    selected = 0;
    renderResults("");
    if (!palette.open) palette.showModal();
    requestAnimationFrame(() => paletteInput.focus());
  }

  $("#palette-open")?.addEventListener("click", openPalette);
  paletteInput?.addEventListener("input", () => { selected = 0; renderResults(paletteInput.value); });
  paletteResults?.addEventListener("click", (event) => {
    const item = event.target.closest(".palette-item");
    if (item) choose(Number(item.dataset.index));
  });
  paletteInput?.addEventListener("keydown", (event) => {
    if (event.key === "ArrowDown") { event.preventDefault(); selected = clamp(selected + 1, 0, filtered.length - 1); renderResults(paletteInput.value); }
    else if (event.key === "ArrowUp") { event.preventDefault(); selected = clamp(selected - 1, 0, filtered.length - 1); renderResults(paletteInput.value); }
    else if (event.key === "Enter") { event.preventDefault(); choose(selected); }
  });

  /* ---------------- theme and controls ---------------- */

  function applyTheme(theme) {
    root.dataset.theme = theme;
    themeIcon.setAttribute("href", theme === "dark" ? "#i-sun" : "#i-moon");
    $("#theme").title = theme === "dark" ? "Switch to light (T)" : "Switch to dark (T)";
    try { localStorage.setItem("computronium-theme", theme); } catch { /* private mode */ }
  }

  function toggleTheme() {
    applyTheme(root.dataset.theme === "dark" ? "light" : "dark");
  }

  function typingInField(target) {
    return target instanceof Element && Boolean(target.closest("input, textarea, select, [contenteditable='true']"));
  }

  applyTheme((() => {
    try {
      const stored = localStorage.getItem("computronium-theme");
      if (stored === "dark" || stored === "light") return stored;
    } catch { /* private mode */ }
    return "dark";
  })());

  $("#theme")?.addEventListener("click", toggleTheme);
  $("#print")?.addEventListener("click", () => window.print());
  presentBtn?.addEventListener("click", () => setReading(false));
  readBtn?.addEventListener("click", () => setReading(true));
  notesBtn?.addEventListener("click", openNotes);
  $$(".tab").forEach((tab) => {
    tab.addEventListener("click", (event) => {
      if (location.hash === tab.getAttribute("href")) {
        event.preventDefault();
        applyRoute();
      }
    });
  });

  window.addEventListener("keydown", (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const key = event.key;
    if (typingInField(event.target)) {
      if (key === "Escape") event.target.blur();
      return;
    }
    if (key === "k" || key === "K" || key === "/") {
      event.preventDefault();
      openPalette();
      return;
    }
    if (key === "t" || key === "T") { toggleTheme(); return; }
    if (key === "p" || key === "P") { window.print(); return; }
    if (key === "n" || key === "N") { openNotes(); return; }
    if (key === "d" || key === "D") {
      if (body.dataset.set === "about") setReading(!reading);
      return;
    }
    if (body.dataset.set === "cheatsheet") {
      if (key === "0") { event.preventDefault(); navigate("cheatsheet"); return; }
      if (key === "+" || key === "=") { event.preventDefault(); zoomBy(1.25); return; }
      if (key === "-") { event.preventDefault(); zoomBy(1 / 1.25); return; }
      return;
    }
    if (body.dataset.set !== "about" || reading) return;
    const forward = key === "ArrowDown" || key === "ArrowRight" || key === "PageDown" || key === "j"
      || (key === " " && !event.shiftKey);
    const backward = key === "ArrowUp" || key === "ArrowLeft" || key === "PageUp" || key === "k"
      || (key === " " && event.shiftKey);
    if (forward) { event.preventDefault(); goSlide(current + 1); }
    else if (backward) { event.preventDefault(); goSlide(current - 1); }
    else if (key === "Home") { event.preventDefault(); goSlide(0); }
    else if (key === "End") { event.preventDefault(); goSlide(slides.length - 1); }
  });

  /* ---------------- scroll, resize, boot ---------------- */

  let settleTimer;
  deck?.addEventListener("scroll", () => {
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => {
      if (body.dataset.set === "about" && !reading) spySlides();
    }, 140);
  }, { passive: true });

  let scrollTick = false;
  window.addEventListener("scroll", () => {
    if (scrollTick) return;
    scrollTick = true;
    requestAnimationFrame(() => {
      scrollTick = false;
      if (body.dataset.set === "docs") updateTocActive();
      else if (body.dataset.set === "about" && reading) spySlides();
    });
  }, { passive: true });

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (body.dataset.set === "cheatsheet") refitMap();
      if (body.dataset.set === "about" && !reading) fit();
      updateZoomLabel();
    }, 120);
  });

  window.addEventListener("hashchange", () => applyRoute());

  const initialRoute = parseRoute();
  if (!location.hash) {
    history.replaceState(null, "", `#/about/${slides[0]?.id || ""}`);
  }
  applyRoute({ instant: true });
  if (initialRoute.set === "about") updateCounter();
  fit();
  document.fonts?.ready.then(fit);
  window.addEventListener("load", fit);
  $$("img").forEach((image) => image.addEventListener("load", () => {
    fit();
    if (body.dataset.set === "docs") updateTocActive();
  }));
})();
</script>
</body>
