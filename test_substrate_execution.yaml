meta:
  name: test_substrate
  description: Accuracy vs noise for analog/memristive/optical substrates
  hypotheses:
  - H3_substrate_noise_robustness
  tags:
  - substrate
  - noise
  - robustness
  - flagship
  created_at: '2026-10-09T21:09:59.701539'
  version: '1.0'
design:
  design_type: full_factorial
  factors:
    substrate:
      name: substrate
      type: between_subjects
      values:
      - digital
      - analog
      - memristive
      - optical
    noise_level:
      name: noise_level
      type: within_subjects
      values:
      - 0.0
      - 0.01
      - 0.05
      - 0.1
      - 0.2
    credit:
      name: credit
      type: between_subjects
      values:
      - gradient
      - thermodynamic_contrast
  fixed:
    geometry:
      name: geometry
      value: feedforward
    dynamics:
      name: dynamics
      value: energy_minimization
    update:
      name: update
      value: adam
    plasticity:
      name: plasticity
      value: 'null'
  blocks:
  - task: mnist
    epochs: 5
    seeds: 3
    fidelity: L0
    extra: {}
  power_analysis:
    enabled: true
    min_effect_size: 0.4
    required_power: 0.8
    alpha: 0.05
    test_type: paired_t_test
    adaptive: false
    interim_analyses: 0
  generators: []
analysis:
  primary: Accuracy vs noise curves with error bars per substrate
  secondary:
  - energy_per_step
  - walltime_total
  - stability_margin
  stats:
  - anova_two_way
  - cohens_d
  - cliffs_delta
  visualizations:
  - noise_curves
  - substrate_comparison
  - pareto
  multiple_comparison_correction: benjamini_hochberg
  exploratory: false
resources:
  max_wall_hours: 0.05
search_space:
  base: {}
  constraints: []
arms:
  adaptive: {}
hpo:
