  - name: robustness_slope
    direction: maximize
    weight: 1.0
  n_trials: 20
  n_startup_trials: 5
  n_seeds: 3
  seed: 42
output:
  db: experiment.db
  artifacts_dir: artifacts
  log_level: INFO
  emit_every: 5
  export_formats:
  - json
  - parquet
reproducibility:
  seed: 42
  capture_env: true
  artifact_hash: true
