[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# include-package-data alone resolves through MANIFEST.in or a VCS plugin, and
# this project has neither: measured against a built wheel, every package .json
# was being dropped. `ruler_table.json` is the load-bearing one -- without it
# campaign._ruler_lr falls back to a flat 1e-2 for tasks calibrated at 1e-3.
computronium = ["**/*.json"]

[tool.setuptools.packages.find]
include = ["computronium*"]

[project]
name = "computronium"
version = "3.0.0"
description = "Unified platform for exploring the full spectrum of bio-plausible learning rules across machine intelligence"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core ML framework
    "torch>=2.5",
    # Numerical
    "numpy",
    # CLI / progress / output
    "tqdm",
    # Configuration & validation
    "pydantic>=2.0",
    "omegaconf>=2.3",
    "kademlia>=2.2.3",
    "torch-geometric>=2.8.0.post1",
    # Platform packages (TODO20 Rule 6: one copy, adapters on legacy paths)
    "ceec-core",
    "psi-peft",
    "stability",
    "local-feedback",
    "computronium-lab",
    "pandas>=3.0.5",
    "optuna>=4.9.0",
    "torchvision>=0.29.0",
    "pytorch-lightning>=2.6.6",
    "duckdb>=1.5.6",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ceec-core = { workspace = true }
psi-peft = { workspace = true }
stability = { workspace = true }
local-feedback = { workspace = true }
computronium-lab = { workspace = true }
computronium = { workspace = true }

[project.optional-dependencies]
# --- Development tools ---
dev = [
    # Test framework
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist",
    "pytest-mock",
    "hypothesis>=6.0",
    # Code quality
    "ruff>=0.6",
    "pyright>=1.1.414",
    "pre-commit",
    "build",
    "twine",
    "pip-audit",
    # Test dependencies
    "torchvision",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas",
    "optuna",
    "tabulate>=0.9",
    "rich",
    "psutil",
    "gymnasium",
    "fastapi",
    "uvicorn",
    "onnxruntime",
    "datasets",
    "plotly>=6.9.0",
    "umap-learn>=0.5.9",
    "cryptography==50.0.0",
]

# --- Core feature groups ---
nn = []  # ComputroniumLinear, pluggable credit rules — zero extra deps
stability-guard = []  # alias for the stability workspace dep (extras name must not shadow it)

# --- Domain / data ---
vision = ["torchvision"]
lm = ["transformers", "datasets", "tokenizers"]
rl = ["gymnasium"]
spiking = ["snnTorch>=0.8", "cupy-cuda13x>=14.1.1"]

# --- Training infrastructure ---
lightning = ["pytorch-lightning>=2.6.6"]
analysis = ["optuna", "tabulate>=0.9"]

# --- ML/data utilities ---
ml = ["scikit-learn", "pandas", "scipy"]

# --- Terminal rendering (renderer layer; not a core import, see TODO35 §1.4) ---
console = ["rich"]

# --- Plotting & visualization ---
plot = ["matplotlib", "seaborn", "plotly>=6.9.0"]

# --- Deployment & serving ---
deploy = ["fastapi", "uvicorn"]
export = ["onnx", "onnxscript", "onnxruntime"]

# --- Networking ---
p2p = ["kademlia", "grpcio>=1.62", "grpcio-tools>=1.62"]

# --- System monitoring ---
monitoring = ["psutil"]

# --- Existing optional groups ---
knowledgebase = ["gpytorch", "botorch", "sympy"]
graphs = ["torch-geometric>=2.5", "networkx"]
llm = ["openai>=1.0"]

# --- Full install ---
full = [
    "computronium[vision,lm,rl,spiking,lightning,analysis,ml,plot,console,deploy,export,p2p,monitoring,knowledgebase,graphs,llm,nn]",
]

[project.urls]
homepage = "https://github.com/computronium/computronium"
repository = "https://github.com/computronium/computronium"
documentation = "https://computronium.readthedocs.io"

[project.scripts]
comp = "computronium.cli.__main__:main"

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "grpcio-tools>=1.83.0",
    "httpx2>=2.12.0",
    "hypothesis>=6.161.2",
    "libcst>=1.9.0",
    "matplotlib>=3.11.1",
    "pip-audit>=2.10.1",
    "plotly>=7.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "selenium>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/property", "tests/primitives", "tests/algorithms", "tests/acceleration"]
# NiceGUI Screen tests register pages in-test; no repo-root main.py (empty →
# get_path_to_main_file returns None and the plugin's in-process ui.run path runs).
main_file = ""
markers = [
    "slow: marks tests as slow (e.g. MNIST full epoch)",
    "gpu: runs on CUDA device; skipped when GPU unavailable",
    "gpu_only: requires CUDA; skipped on CPU-only machines",
    "cpu_only: runs on CPU only; skipped when GPU required",
    "benchmark: performance/parity benchmark producing JSONL",
    "flaky: quarantined non-deterministic test (Sprint 5.6)",
    "llm: requires a real LLM provider; skipped in CI",
    "integration: integration tests requiring external deps or long runtime",
    "demo: gallery demo — trains networks and re-pins docs/figures; run with -m demo",
    "filterwarnings: builtin, registered for --strict-markers compat",
    "timeout: marks tests with a timeout (requires pytest-timeout)",
]
addopts = "-n 4 --strict-markers --durations=25 -m 'not slow and not benchmark and not llm and not demo' -p no:warnings"
# pytest-timeout is the kill, and its signal method already dumps the stack of
# the test it stops. faulthandler's own 120s dump fired on every test that
# legitimately runs longer than the default -- it printed "Timeout (0:02:00)!"
# for tests that then passed, which reads exactly like the failure it was
# meant to diagnose. A test over the default now carries an explicit
# `@pytest.mark.timeout(...)`; nothing else needed a second clock.
faulthandler_timeout = 0
timeout = 120
timeout_method = "signal"

[tool.coverage.run]
source = ["computronium"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/acceleration/*",
    "*/analysis/*",
    "*/validation/*",
    "*/cli/*",
    "*/experiments/*",
    "*/joint/*",
    "*/plasticity/*",
    "*/tile/*",
    "*/autoscientist/*",
    "*/models/native/*",
]

[tool.ruff]
target-version = "py314"
line-length = 88
preview = true
exclude = ["*.md", "*_pb2.py", "*_pb2_grpc.py", "docs/generated"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "C9",   # mccabe complexity
    "PLR",  # pylint refactoring
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "RUF",  # ruff-specific
    "S",    # bandit security
    "TCH",  # flake8-type-checking
    "TRY",  # tryceratops
    "ARG",  # flake8-unused-arguments
    "PTH",  # pathlib
    "ERA",  # eradicate
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line-too-long — disabled forever (user directive 2026-09-03): the formatter handles what it can, the rest is noise
    "PLR2004", # magic-value-comparison — numeric research thresholds (0.5, 1e-4, ...) are the domain's first-class objects
    "PLR6301", # no-self-use — protocol implementations keep a uniform method surface (self unused by design)
    "ARG001",  # unused-function-argument — math notation (W, G, V, X) is the domain's naming convention
    "ARG002",  # unused-method-argument — ditto
    "N806",    # non-lowercase-variable-in-function — ditto for local math variables
    "N803",    # invalid-argument-name — ditto for argument names, plus Triton's DSL-mandated kernel params (BLOCK_*, *_ptr)
    "B904",    # unnecessary-paren-on-raise-exception — long messages in raise calls are the sanctioned error style (AGENTS.md)
    "TRY003",  # raise-vanilla-args — ditto; long descriptive messages stay at the raise site
    "RUF001",  # ambiguous-unicode-character-string — Greek/math symbols (β, θ, ≈) in strings are the domain language
    "RUF002",  # ambiguous-unicode-character-docstring — ditto
    "RUF003",  # ambiguous-unicode-character-comment — ditto
    "RUF069",  # float-equality-comparison — exact sentinel comparisons (== 0.0, != 2.0) against exactly-assigned configs are load-bearing (bitwise L5 locks)
    "ERA001",  # commented-out-code — eradicate false positive on `# ruff: file-ignore[...]` directives in __init__.py
    # Suppression-comment style rules (ruff 0.15 directive family): the repo
    # uses ~1.5k legacy `# ruff: ignore[rule-name]` guard-rail comments;
    # RUF100 marks them unused, RUF105/106 want the other directive form and
    # RUF103 rejects it back. Canonical-form migration is Register C work;
    # enabling these rules only churns guard-rails without lint signal.
    "RUF100",  # unused-noqa
    "RUF103",  # invalid-suppression-comment
    # "RUF105",  # noqa-comments — new preview rule prefers `ruff: ignore`; canonical directive migration is Register C
    # "RUF201",  # rule-codes-in-selectors — codes are the enforced canonical selector form (2026-09-16 mid-flight fix)
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "S101",  # assert — demos exit 0 only when the demonstrated property holds
    "TC001", # demos are scripts: runtime imports keep the dependency explicit
    "TC003",
]
"computronium/__init__.py" = [
    "RUF004",  # invalid-all-format — undefined-export — __all__ names resolve through the _LAZY import map
]
"computronium/ontology/dynamics/__init__.py" = [
    "RUF012",  # implicit-namespace-package — DYNAMICS_REGISTRY lives beside its classes (R1.1)
    "RUF013",  # non-empty-init-module — the registry is the single-source wiring point by design (TODO18 wiring lock)
]
"computronium/acceleration/pc_kernels.py" = [
    "PLR0915",
    "PLW0717",
]
"computronium/acceleration/{fa_kernels,ff_kernels,hebbian_kernels,kernels,snn_kernels,tile_kernels,triton_kernels,compile,kernel_backend}.py" = [
    "PLW0717", # too-many-statements-in-try-clause — guarded Triton import ladder
    "RUF100",  # noqa-comments — the noqa is on a guarded import ladder
]
"computronium/acceleration/triton_kernels.py" = [
    "PLW0717", "RUF100",
    "PLR0913", # too-many-arguments — kernel parameter surfaces are wide by design
    "PLR0914", # too-many-locals — ditto
    "PLR0911", # too-many-positional-arguments — ditto
]
"computronium/acceleration/microbench.py" = ["RUF100"]
"computronium/acceleration/backends.py" = ["RUF100"]
"computronium/ontology/system.py" = ["SIM102"] # collapsible-if — validation clarity over brevity
"computronium/ontology/credit.py" = [
    "ARG002", # unused-method-argument — protocol surface uniformity
    "PLR6104", "PLW2901",
]
"computronium/ontology/geometry.py" = ["ARG002"]
"computronium/ontology/substrate/_substrate.py" = ["ARG002"]
"computronium/ontology/update.py" = ["ARG002"]
"computronium/state/transitions.py" = ["ARG002"]
"computronium/domains/trainer.py" = [
    "PLR0913", # too-many-arguments — trainer config is necessarily wide
    "PLR0911", # too-many-positional-arguments — ditto
    "S101",    # assert — internal invariant guard
]
"computronium/experiment/evidence/store.py" = [
    "PLW0717", "RUF100",
    "S608",    # hardcoded-sql-expression — parameterized queries by design
]
"computronium/experiment/execution/search_space.py" = [
    "PLW0717", "RUF100", "E402", "TC001", "TC002", "TC003",
    "PLR0912", "PLR0915", "PLR0914", "PLR1702", "C401", "F841",
]
"computronium/experiment/execution/stages_impl.py" = [
    "PLW0717", "RUF100", "E402", "TC001", "TC003",
    "PLR0912", "PLR0915", "PLR0914", "C901",
    "SIM105", "SIM110", "PLR1730", "F841",
]
"computronium/experiment/execution/compose.py" = ["PLW0717", "RUF100"]
"computronium/experiment/execution/policy.py" = ["PLW0717"]
"computronium/experiment/execution/sysctx.py" = ["PLW0717"]
"computronium/experiment/execution/optuna_adapter.py" = ["PLR0911", "PGH003"]
"computronium/experiment/legality/engine.py" = ["PLW0717"]
"computronium/experiment/legality/dsl.py" = ["RUF100"]
"computronium/experiment/schema/primitives.py" = ["E402"]
"computronium/experiment/schema/harvest.py" = ["PLR0912", "PLW0717", "SIM105", "TRY300", "PLW2901"]
"computronium/experiment/surface/conformance.py" = ["S404", "S603", "S607", "SIM108", "F841"]
"computronium/experiment/surface/operations.py" = ["PLW0717"]
"computronium/experiment/surface/report.py" = ["RUF100"]
"computronium/cli/joint_validate.py" = ["PLW0717"]
"computronium/core/continual/runner.py" = ["PLR0913", "PLR0911", "PLW2901", "E741"]
"computronium/core/continual/training.py" = ["TC001", "PLR0914"]
"computronium/core/local_learning/settling.py" = ["PLR0913", "RUF059"]
"computronium/core/presets.py" = ["PLR0915"]
"computronium/core/substrates/complex_substrate.py" = ["PLW0717", "RUF100"]
"computronium/core/system_trainer/factory.py" = ["C901"]
"computronium/core/system_trainer/joint.py" = ["PLR0912"]
"computronium/core/tile/topology.py" = ["PLR0912", "C901"]
"computronium/data/lm.py" = ["PLW0717", "RUF100"]
"computronium/deployment/serialization.py" = ["PLW0717", "RUF100", "SIM117"]
"computronium/models/deployments/config.py" = ["PLR0913"]
"computronium/ontology/dynamics/_dynamics.py" = [
    "PLR6104",
    "PLR0913", "PLW0717", "SIM105", "SIM108", "RUF100",
]
"computronium/p2p/grpc_service.py" = ["PLW0717", "RUF100"]
"computronium/utils.py" = ["S404", "SIM105"]
"computronium/validation/notebook.py" = ["PLW0717", "RUF100"]
"computronium/validation/tracks/hardware_tracks.py" = ["PLR6104"]
"computronium/validation/tracks/_signal_probe.py" = ["PLW0717", "RUF100"]
"computronium/validation/tracks/signal_tracks.py" = ["PLW0717", "RUF100"]
"computronium/validation/tracks/track_registry.py" = ["PLW0717"]
"computronium/validation/verifier.py" = ["PLR0914", "PLR0915", "C901", "SIM108", "PLR1730", "SIM118"]
"computronium/ontology/_settle_kernel.py" = [
    "PLR6104", # non-augmented-assignment — out-of-place adds are the settle graph-safety idiom (R5.3); `+=` on a graph tensor changes autograd semantics
]
"packages/*/tests/**/*.py" = [
    "S101",   # assert in standalone-package tests
]
"scripts/probes/x_*.py" = [
    "I001",  # unsorted-imports — module-import-not-at-top-of-file — sys.path bootstrap before computronium imports
    "ISC001", # single-line-implicit-string-concatenation — import block follows the sys.path insert by design
]
"scripts/{probes/**,audit_*.py}" = [
    # Research probes and the audit_* diagnostics are sanctioned throwaways
    # (AGENTS probe conventions): numbers-in-docstrings matter, lint polish
    # does not. Security rules stay active; these close the style/complexity
    # classes only. Audit scripts keep the explicit rebind form (`x = x * m`,
    # not `x *= m`): the operand is a torch tensor, so `*=` mutates it in
    # place, and the correctness of that depends on the line above staying
    # unaliased -- TODO34 Pass 2 recorded the same decision for the
    # production kernel.
    "S101",    # assert — asserts are the probe's sanity gates
    "S324",    # hashlib-insecure-hash-function — md5 for non-cognitive cache keys
    "PLR0911", # too-many-return-statements — complexity budgets don't apply to one-off sweeps
    "PLR0912", # too-many-branches — ditto
    "PLR0914", # too-many-locals — ditto
    "PLR0915", # too-many-statements — ditto
    "PLW0603", # global-statement — probe-level module state by design
    "PLW2901", # redefined-loop-name — loop-var overwrite is a common probe idiom
    "PLW2901", # redefined-argument-from-local — manual counters read clearer in sweep loops
    "RUF006",  # asyncio-dangling-task — fire-and-forget probe tasks
    "E741",    # ambiguous-variable-name — single-letter math names (l, n) are the domain language
    "F841",    # unused-variable — assignments kept for side effects / future inspection
    "ARG005",  # unused-lambda-argument — lambda placeholders in tracker callbacks
    "PLR6104",  # non-augmented-assignment — ditto; probes accumulate torch tensors out-of-place for the same graph-safety reason
]
"computronium/primitives/substrate/noisy/reference.py" = [
    "TC001", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/sparse/reference.py" = [
    "TC001", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/complex/reference.py" = [
    "TC001", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/ternary/reference.py" = [
    "TC001", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/geometry/spatial_lattice_3d/reference.py" = [
    "TC001", # FeedforwardGeometry used in function signature and body; false positive
]
"computronium/primitives/substrate/noisy/kernel.py" = [
    "TC001", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/sparse/kernel.py" = [
    "TC001", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/complex/kernel.py" = [
    "TC001", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/ternary/kernel.py" = [
    "TC001", # SubstrateSpec used in function signature and body; false positive
]
"tests/**/*.py" = [
    "S101",   # assert in tests
    "S404",   # suspicious-subprocess-import — subprocess CLI smoke / wheel-acceptance tests
    "S603",   # subprocess-without-shell-equals-true — ditto
    "S607",   # start-process-with-partial-path — subprocess CLI smoke tests; partial-path executables (uv)
    "S311",   # suspicious-non-cryptographic-random-usage — random.Random in test samplers/fixtures
    "PLR2004", # magic-value-comparison — literal expected values in assertions
]

[tool.ruff.lint.flake8-type-checking]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 9
max-branches = 12
max-locals = 15
max-returns = 6
max-statements = 50
max-positional-args = 9

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
preview = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.hypothesis]
database = {file = ".hypothesis/example.db"}
verbosity = "verbose"
phases = ["generate", "shrink", "explain"]
max_examples = 100
deadline = 500
print_blob = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
