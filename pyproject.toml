[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["computronium*"]

[project]
name = "computronium"
version = "1.0.0"
description = "Unified platform for exploring the full spectrum of bio-plausible learning rules across machine intelligence"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core ML framework
    "torch>=2.5",
    # Numerical
    "numpy",
    # CLI / progress / output
    "tqdm",
    "rich",
    # Configuration & validation
    "pydantic>=2.0",
    "omegaconf>=2.3",
    "kademlia>=2.2.3",
    "torch-geometric>=2.8.0.post1",
    # Platform packages (TODO20 Rule 6: one copy, adapters on legacy paths)
    "ceec-core",
    "psi-peft",
    "stability",
    "local-feedback",
    "computronium-lab",
    "pandas>=3.0.5",
    "optuna>=4.9.0",
    "torchvision>=0.29.0",
    "pytorch-lightning>=2.6.6",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ceec-core = { workspace = true }
psi-peft = { workspace = true }
stability = { workspace = true }
local-feedback = { workspace = true }
computronium-lab = { workspace = true }
computronium = { workspace = true }

[project.optional-dependencies]
# --- Development tools ---
dev = [
    # Test framework
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist",
    "pytest-mock",
    "hypothesis>=6.0",
    # Code quality
    "ruff>=0.6",
    "pyright>=1.1.414",
    "pre-commit",
    "build",
    "twine",
    "pip-audit",
    # Test dependencies
    "torchvision",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas",
    "optuna",
    "tabulate>=0.9",
    "psutil",
    "gymnasium",
    "fastapi",
    "uvicorn",
    "onnxruntime",
    "datasets",
    "plotly>=6.9.0",
    "umap-learn>=0.5.9",
    "cryptography==50.0.0",
]

# --- Core feature groups ---
nn = []  # ComputroniumLinear, pluggable credit rules — zero extra deps
stability-guard = []  # alias for the stability workspace dep (extras name must not shadow it)

# --- Domain / data ---
vision = ["torchvision"]
lm = ["transformers", "datasets", "tokenizers"]
rl = ["gymnasium"]
spiking = ["snnTorch>=0.8", "cupy-cuda13x>=14.1.1"]

# --- Training infrastructure ---
lightning = ["pytorch-lightning>=2.6.6"]
analysis = ["optuna", "tabulate>=0.9"]

# --- ML/data utilities ---
ml = ["scikit-learn", "pandas", "scipy"]

# --- Plotting & visualization ---
plot = ["matplotlib", "seaborn", "plotly>=6.9.0"]

# --- Deployment & serving ---
deploy = ["fastapi", "uvicorn"]
export = ["onnx", "onnxscript", "onnxruntime"]

# --- Networking ---
p2p = ["kademlia", "grpcio>=1.62", "grpcio-tools>=1.62"]

# --- System monitoring ---
monitoring = ["psutil"]

# --- Existing optional groups ---
knowledgebase = ["gpytorch", "botorch", "sympy"]
graphs = ["torch-geometric>=2.5", "networkx"]
llm = ["openai>=1.0"]

# --- Full install ---
full = [
    "computronium[vision,lm,rl,spiking,lightning,analysis,ml,plot,deploy,export,p2p,monitoring,knowledgebase,graphs,llm,nn]",
]

[project.urls]
homepage = "https://github.com/computronium/computronium"
repository = "https://github.com/computronium/computronium"
documentation = "https://computronium.readthedocs.io"

[project.scripts]
comp = "computronium.cli.__main__:main"

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "grpcio-tools>=1.83.0",
    "httpx2>=2.12.0",
    "hypothesis>=6.161.2",
    "libcst>=1.9.0",
    "matplotlib>=3.11.1",
    "pip-audit>=2.10.1",
    "plotly>=7.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "selenium>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/property", "tests/primitives", "tests/algorithms", "tests/acceleration"]
# NiceGUI Screen tests register pages in-test; no repo-root main.py (empty →
# get_path_to_main_file returns None and the plugin's in-process ui.run path runs).
main_file = ""
markers = [
    "slow: marks tests as slow (e.g. MNIST full epoch)",
    "gpu: runs on CUDA device; skipped when GPU unavailable",
    "gpu_only: requires CUDA; skipped on CPU-only machines",
    "cpu_only: runs on CPU only; skipped when GPU required",
    "benchmark: performance/parity benchmark producing JSONL",
    "flaky: quarantined non-deterministic test (Sprint 5.6)",
    "llm: requires a real LLM provider; skipped in CI",
    "integration: integration tests requiring external deps or long runtime",
    "filterwarnings: builtin, registered for --strict-markers compat",
    "timeout: marks tests with a timeout (requires pytest-timeout)",
]
addopts = "--strict-markers --durations=25 -m 'not slow and not benchmark and not llm' -p no:warnings"
faulthandler_timeout = 120
timeout = 120
timeout_method = "signal"

[tool.coverage.run]
source = ["computronium"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/acceleration/*",
    "*/analysis/*",
    "*/validation/*",
    "*/cli/*",
    "*/experiments/*",
    "*/joint/*",
    "*/plasticity/*",
    "*/tile/*",
    "*/autoscientist/*",
    "*/models/native/*",
]

[tool.ruff]
target-version = "py314"
line-length = 88
preview = true
exclude = ["*.md", "*_pb2.py", "*_pb2_grpc.py", "docs/archive"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "C9",   # mccabe complexity
    "PLR",  # pylint refactoring
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "RUF",  # ruff-specific
    "S",    # bandit security
    "TCH",  # flake8-type-checking
    "TRY",  # tryceratops
    "ARG",  # flake8-unused-arguments
    "PTH",  # pathlib
    "ERA",  # eradicate
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "SIM",  # flake8-simplify
]
ignore = [
    "line-too-long",   # E501 — disabled forever (user directive 2026-09-03): the formatter handles what it can, the rest is noise
    "magic-value-comparison", # PLR2004 — numeric research thresholds (0.5, 1e-4, ...) are the domain's first-class objects
    "no-self-use", # PLR6301 — protocol implementations keep a uniform method surface (self unused by design)
    "unused-function-argument",    # ARG001 — math notation (W, G, V, X) is the domain's naming convention
    "unused-method-argument",  # ARG002 — ditto
    "non-lowercase-variable-in-function",    # N806 — ditto for local math variables
    "invalid-argument-name", # N803 — ditto for argument names, plus Triton's DSL-mandated kernel params (BLOCK_*, *_ptr)
    "unnecessary-paren-on-raise-exception",  # B904 — long messages in raise calls are the sanctioned error style (AGENTS.md)
    "raise-vanilla-args",  # TRY003 — ditto; long descriptive messages stay at the raise site
    "ambiguous-unicode-character-string",  # RUF001 — Greek/math symbols (β, θ, ≈) in strings are the domain language
    "ambiguous-unicode-character-docstring",  # RUF002 — ditto
    "ambiguous-unicode-character-comment",  # RUF003 — ditto
    "float-equality-comparison",  # RUF069 — exact sentinel comparisons (== 0.0, != 2.0) against exactly-assigned configs are load-bearing (bitwise L5 locks)
    "commented-out-code",  # ERA001 — eradicate false positive on `# ruff: file-ignore[...]` directives in __init__.py
    # Suppression-comment style rules (ruff 0.15 directive family): the repo
    # uses ~1.5k legacy `# ruff: ignore[rule-name]` guard-rail comments;
    # RUF100 marks them unused, RUF105/106 want the other directive form and
    # RUF103 rejects it back. Canonical-form migration is Register C work;
    # enabling these rules only churns guard-rails without lint signal.
    "unused-noqa",  # RUF100
    "invalid-suppression-comment",  # RUF103
    # "RUF105",  # noqa-comments — new preview rule prefers `ruff: ignore`; canonical directive migration is Register C
    # "RUF201",  # rule-codes-in-selectors — codes are the enforced canonical selector form (2026-09-16 mid-flight fix)
]

[tool.ruff.lint.per-file-ignores]
"computronium/__init__.py" = [
    "invalid-all-format", # undefined-export — __all__ names resolve through the _LAZY import map
]
"computronium/ontology/dynamics/__init__.py" = [
    "implicit-namespace-package", # implicit-namespace-package — DYNAMICS_REGISTRY lives beside its classes (R1.1)
    "non-empty-init-module", # non-empty-init-module — the registry is the single-source wiring point by design (TODO18 wiring lock)
]
"computronium/ontology/dynamics/_dynamics.py" = [
    "non-augmented-assignment", # PLR6104 — out-of-place adds are the settle graph-safety idiom (R5.3); `+=` on a graph tensor changes autograd semantics
]
"computronium/ontology/_settle_kernel.py" = [
    "non-augmented-assignment", # PLR6104 — out-of-place adds are the settle graph-safety idiom (R5.3); `+=` on a graph tensor changes autograd semantics
]
"packages/*/tests/**/*.py" = [
    "assert",   # assert in standalone-package tests
]
"scripts/probes/x_*.py" = [
    "unsorted-imports",  # module-import-not-at-top-of-file — sys.path bootstrap before computronium imports
    "single-line-implicit-string-concatenation",  # unsorted-imports — import block follows the sys.path insert by design
]
"scripts/{probes/**,audit_*.py}" = [
    # Research probes and the audit_* diagnostics are sanctioned throwaways
    # (AGENTS probe conventions): numbers-in-docstrings matter, lint polish
    # does not. Security rules stay active; these close the style/complexity
    # classes only. Audit scripts keep the explicit rebind form (`x = x * m`,
    # not `x *= m`): the operand is a torch tensor, so `*=` mutates it in
    # place, and the correctness of that depends on the line above staying
    # unaliased -- TODO34 Pass 2 recorded the same decision for the
    # production kernel.
    "assert",    # S101 — asserts are the probe's sanity gates
    "hashlib-insecure-hash-function",    # S324 — md5 for non-cognitive cache keys
    "too-many-return-statements", # PLR0911 — complexity budgets don't apply to one-off sweeps
    "too-many-branches", # PLR0912 — ditto
    "too-many-locals", # PLR0914 — ditto
    "too-many-statements", # PLR0915 — ditto
    "global-statement", # PLW0603 — probe-level module state by design
    "redefined-loop-name", # PLW2901 — loop-var overwrite is a common probe idiom
    "redefined-argument-from-local", # PLW2901 — manual counters read clearer in sweep loops
    "asyncio-dangling-task",    # RUF006 — fire-and-forget probe tasks
    "ambiguous-variable-name",    # E741 — single-letter math names (l, n) are the domain language
    "unused-variable",    # F841 — assignments kept for side effects / future inspection
    "unused-lambda-argument",  # ARG005 — lambda placeholders in tracker callbacks
    "non-augmented-assignment",  # PLR6104 — ditto; probes accumulate torch tensors out-of-place for the same graph-safety reason
]
"computronium/primitives/substrate/noisy/reference.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/sparse/reference.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/complex/reference.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/ternary/reference.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/geometry/spatial_lattice_3d/reference.py" = [
    "typing-only-first-party-import", # FeedforwardGeometry used in function signature and body; false positive
]
"computronium/primitives/substrate/noisy/kernel.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/sparse/kernel.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/complex/kernel.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/ternary/kernel.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"tests/**/*.py" = [
    "assert",   # S101 — assert in tests
    "suspicious-subprocess-import",  # S404 — subprocess CLI smoke / wheel-acceptance tests
    "subprocess-without-shell-equals-true",   # S603 — ditto
    "start-process-with-partial-path",   # S607 — subprocess CLI smoke tests; partial-path executables (uv)
    "suspicious-non-cryptographic-random-usage",   # S311 — random.Random in test samplers/fixtures
    "magic-value-comparison", # PLR2004 — literal expected values in assertions
]

[tool.ruff.lint.flake8-type-checking]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 9
max-branches = 12
max-locals = 15
max-returns = 6
max-statements = 50
max-positional-args = 9

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
preview = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.hypothesis]
database = {file = ".hypothesis/example.db"}
verbosity = "verbose"
phases = ["generate", "shrink", "explain"]
max_examples = 100
deadline = 500
print_blob = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
