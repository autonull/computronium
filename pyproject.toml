[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["computronium*"]

[project]
name = "computronium"
version = "1.0.0"
description = "Unified platform for exploring the full spectrum of bio-plausible learning rules across machine intelligence"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core ML framework
    "torch>=2.5",
    # Numerical
    "numpy",
    # CLI / progress / output
    "tqdm",
    "rich",
    # Configuration & validation
    "pydantic>=2.0",
    "omegaconf>=2.3",
    "kademlia>=2.2.3",
    "torch-geometric>=2.8.0.post1",
    # Platform packages (TODO20 Rule 6: one copy, adapters on legacy paths)
    "ceec-core",
    "psi-peft",
    "stability",
    "local-feedback",
    "computronium-lab",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ceec-core = { workspace = true }
psi-peft = { workspace = true }
stability = { workspace = true }
local-feedback = { workspace = true }
computronium-lab = { workspace = true }
computronium = { workspace = true }

[project.optional-dependencies]
# --- Development tools ---
dev = [
    # Test framework
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist",
    "pytest-mock",
    "hypothesis>=6.0",
    # Code quality
    "ruff>=0.6",
    "pyright>=1.1",
    "pre-commit",
    "build",
    "twine",
    "pip-audit",
    # Test dependencies
    "torchvision",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas",
    "optuna",
    "tabulate>=0.9",
    "psutil",
    "gymnasium",
    "fastapi",
    "uvicorn",
    "onnxruntime",
    "datasets",
    "nicegui>=3.16.0",
    "plotly>=6.9.0",
    "umap-learn>=0.5.9",
    "cryptography==50.0.0",
]

# --- Core feature groups ---
nn = []  # ComputroniumLinear, pluggable credit rules — zero extra deps
stability-guard = []  # alias for the stability workspace dep (extras name must not shadow it)

# --- Domain / data ---
vision = ["torchvision"]
lm = ["transformers", "datasets", "tokenizers"]
rl = ["gymnasium"]
spiking = ["snnTorch>=0.8", "cupy-cuda13x>=14.1.1"]

# --- Training infrastructure ---
lightning = ["pytorch-lightning>=2.6.6"]
analysis = ["optuna", "tabulate>=0.9"]

# --- ML/data utilities ---
ml = ["scikit-learn", "pandas", "scipy"]

# --- Plotting & visualization ---
plot = ["matplotlib", "seaborn", "plotly>=6.9.0"]

# --- Deployment & serving ---
deploy = ["fastapi", "uvicorn"]
export = ["onnx", "onnxscript", "onnxruntime"]

# --- Networking ---
p2p = ["kademlia", "grpcio>=1.62", "grpcio-tools>=1.62"]

# --- Desktop UI ---
ui = ["PyQt6", "pyqtgraph", "nicegui>=3.16.0"]

# --- System monitoring ---
monitoring = ["psutil"]

# --- Existing optional groups ---
knowledgebase = ["gpytorch", "botorch", "sympy"]
graphs = ["torch-geometric>=2.5", "networkx"]
llm = ["openai>=1.0"]

# --- Full install ---
full = [
    "computronium[vision,lm,rl,spiking,lightning,analysis,ml,plot,deploy,export,p2p,ui,monitoring,knowledgebase,graphs,llm,nn]",
]

[project.urls]
homepage = "https://github.com/computronium/computronium"
repository = "https://github.com/computronium/computronium"
documentation = "https://computronium.readthedocs.io"

[project.scripts]
comp = "computronium.cli.__main__:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "hypothesis>=6.161.2",
    "libcst>=1.9.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/property"]
markers = [
    "slow: marks tests as slow (e.g. MNIST full epoch)",
    "gpu: runs on CUDA device; skipped when GPU unavailable",
    "gpu_only: requires CUDA; skipped on CPU-only machines",
    "cpu_only: runs on CPU only; skipped when GPU required",
    "benchmark: performance/parity benchmark producing JSONL",
    "flaky: quarantined non-deterministic test (Sprint 5.6)",
    "llm: requires a real LLM provider; skipped in CI",
    "integration: integration tests requiring external deps or long runtime",
    "filterwarnings: builtin, registered for --strict-markers compat",
    "timeout: marks tests with a timeout (requires pytest-timeout)",
]
addopts = "--strict-markers --durations=25 -m 'not slow and not benchmark and not llm' -p no:warnings"
faulthandler_timeout = 120
timeout = 60
timeout_method = "signal"

[tool.coverage.run]
source = ["computronium"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/acceleration/*",
    "*/analysis/*",
    "*/validation/*",
    "*/cli/*",
    "*/experiments/*",
    "*/joint/*",
    "*/plasticity/*",
    "*/tile/*",
    "*/autoscientist/*",
    "*/models/native/*",
]

[tool.ruff]
target-version = "py314"
line-length = 88
preview = true
exclude = ["*.md", "*_pb2.py", "*_pb2_grpc.py", "docs/archive", "demo"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "C9",   # mccabe complexity
    "PLR",  # pylint refactoring
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "RUF",  # ruff-specific
    "S",    # bandit security
    "TCH",  # flake8-type-checking
    "TRY",  # tryceratops
    "ARG",  # flake8-unused-arguments
    "PTH",  # pathlib
    "ERA",  # eradicate
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line-too-long — disabled forever (user directive 2026-09-03): formatter handles what it can, the rest is noise
    "PLR2004", # magic-value-comparison — numeric research thresholds (0.5, 1e-4, ...) are the domain's first-class objects
    "PLR6301", # no-self-use — protocol implementations keep a uniform method surface (self unused by design)
    "N803",    # invalid-argument-name — math notation (W, G, V, X) is the domain's naming convention
    "N806",    # non-lowercase-variable-in-function — ditto for local math variables
    "RSE102",  # unnecessary-paren-on-raise-exception — long messages in raise calls are the sanctioned error style (AGENTS.md)
    "TRY003",  # raise-vanilla-args — ditto; long descriptive messages stay at the raise site
    "ARG001",  # unused-function-argument — the family-neutral pipeline passes uniform args; primitives ignore some by design
    "ARG002",  # unused-method-argument
    "RUF002",  # ambiguous-unicode-character-docstring — Greek/math symbols (β, θ, ≈) in docstrings are the domain language
    "RUF001",  # ambiguous-unicode-character-string
    "RUF003",  # ambiguous-unicode-character-comment
    "PLR0133", # comparison-of-constant — exact float equality is load-bearing (bitwise L5 locks), not a bug
    "RUF069",  # float-equality-comparison — ditto — exact sentinel comparisons (== 0.0, != 2.0) against exactly-assigned configs
    # Suppression-comment style rules (ruff 0.15 directive family): the repo
    # uses ~1.5k legacy `# ruff: ignore[rule-name]` guard-rail comments;
    # RUF100 marks them unused, RUF105/106 want the other directive form and
    # RUF103 rejects it back. Canonical-form migration is Register C work;
    # enabling these rules only churns guard-rails without lint signal.
    "RUF100",  # unused-noqa
    "RUF103",  # invalid-suppression-comment
    "RUF105",  # noqa-comments — new preview rule prefers `ruff: ignore`; canonical directive migration is Register C
    "RUF201",  # rule-codes-in-selectors — codes are the enforced canonical selector form (2026-09-16 mid-flight fix)
]

[tool.ruff.lint.per-file-ignores]
"computronium/__init__.py" = [
    "F822", # undefined-export — __all__ names resolve through the _LAZY import map
]
"computronium/ontology/dynamics/__init__.py" = [
    "INP001", # implicit-namespace-package — DYNAMICS_REGISTRY lives beside its classes (R1.1)
    "RUF067", # non-empty-init-module — the registry is the single-source wiring point by design (TODO18 wiring lock)
]
"computronium/ontology/dynamics/_dynamics.py" = [
    "PLR6104", # non-augmented-assignment — out-of-place adds are the settle graph-safety idiom (R5.3)
]
"computronium/ontology/_settle_kernel.py" = [
    "PLR6104", # non-augmented-assignment — out-of-place adds are the settle graph-safety idiom (R5.3)
]
"packages/*/tests/**/*.py" = [
    "S101",   # assert in standalone-package tests
]
"scripts/probes/x_*.py" = [
    "E402",  # module-import-not-at-top-of-file — sys.path bootstrap before computronium imports
    "I001",  # unsorted-imports — import block follows the sys.path insert by design
]
"scripts/probes/**" = [
    # Research probes are sanctioned throwaways (AGENTS probe conventions):
    # numbers-in-docstrings matter, lint polish does not. Security rules
    # stay active; these close the style/complexity classes only.
    "S101",    # asserts are the probe's sanity gates
    "S324",    # hashlib-insecure-hash-function — md5 for non-cognitive cache keys
    "PLR0911", # too-many-return-statements — complexity budgets don't apply to one-off sweeps
    "PLR0912", # too-many-branches
    "PLR0914", # too-many-locals
    "PLR0915", # too-many-statements
    "PLR6104", # non-augmented-assignment — out-of-place adds are the settle graph-safety idiom
    "PLW0603", # global-statement — probe-level module state by design
    "PLW2901", # redefined-loop-name — loop-var overwrite is a common probe idiom
    "E741",    # ambiguous-variable-name — single-letter math names (l, n) are the domain language
    "F841",    # unused-variable — assignments kept for side effects / future inspection
    "ARG005",  # unused-lambda-argument — lambda placeholders in tracker callbacks
    "SIM113",  # enumerate-for-loop — manual counters read clearer in sweep loops
]
"tests/**/*.py" = [
    "S101",   # assert in tests
    "S404",   # suspicious-subprocess-import — subprocess CLI smoke / wheel-acceptance tests
    "PLR6301", # no-self-use — no-self-use in test methods
    "S606",   # start-process-with-no-shell — subprocess CLI smoke tests
    "S603",   # subprocess-without-shell-equals-true — subprocess.run with fixed args
    "S607",   # start-process-with-partial-path — partial-path executables (uv)
    "S311",   # suspicious-non-cryptographic-random-usage — random.Random in test samplers/fixtures
    "PLR2004", # magic-value-comparison — literal expected values in assertions
]

[tool.ruff.lint.flake8-type-checking]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 9
max-branches = 12
max-locals = 15
max-returns = 6
max-statements = 50
max-positional-args = 9

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
preview = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.hypothesis]
database = {file = ".hypothesis/example.db"}
verbosity = "verbose"
phases = ["generate", "shrink", "explain"]
max_examples = 100
deadline = 500
print_blob = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
