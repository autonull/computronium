[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# include-package-data alone resolves through MANIFEST.in or a VCS plugin, and
# this project has neither: measured against a built wheel, every package .json
# was being dropped. `ruler_table.json` is the load-bearing one -- without it
# campaign._ruler_lr falls back to a flat 1e-2 for tasks calibrated at 1e-3.
computronium = ["**/*.json"]

[tool.setuptools.packages.find]
include = ["computronium*"]

[project]
name = "computronium"
version = "3.0.0"
description = "Unified platform for exploring the full spectrum of bio-plausible learning rules across machine intelligence"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core ML framework
    "torch>=2.5",
    # Numerical
    "numpy",
    # CLI / progress / output
    "tqdm",
    # Configuration & validation
    "pydantic>=2.0",
    "omegaconf>=2.3",
    "pyyaml",
    "kademlia>=2.2.3",
    "torch-geometric>=2.8.0.post1",
    # Platform packages (TODO20 Rule 6: one copy, adapters on legacy paths)
    "ceec-core",
    "psi-peft",
    "stability",
    "local-feedback",
    "computronium-lab",
    "pandas>=3.0.5",
    "optuna>=4.9.0",
    "torchvision>=0.29.0",
    "pytorch-lightning>=2.6.6",
    "duckdb>=1.5.6",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ceec-core = { workspace = true }
psi-peft = { workspace = true }
stability = { workspace = true }
local-feedback = { workspace = true }
computronium-lab = { workspace = true }
computronium = { workspace = true }

[project.optional-dependencies]
# --- Development tools ---
dev = [
    # Test framework
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist",
    "pytest-mock",
    "hypothesis>=6.0",
    # Code quality
    "ruff>=0.6",
    "pyright>=1.1.414",
    "pre-commit",
    "build",
    "twine",
    "pip-audit",
    # Test dependencies
    "torchvision",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas",
    "optuna",
    "tabulate>=0.9",
    "rich",
    "psutil",
    "gymnasium",
    "fastapi",
    "uvicorn",
    "onnxruntime",
    "datasets",
    "plotly>=6.9.0",
    "umap-learn>=0.5.9",
    "cryptography==50.0.0",
]

# --- Core feature groups ---
nn = []  # ComputroniumLinear, pluggable credit rules — zero extra deps
stability-guard = []  # alias for the stability workspace dep (extras name must not shadow it)

# --- Domain / data ---
vision = ["torchvision"]
lm = ["transformers", "datasets", "tokenizers"]
rl = ["gymnasium"]
spiking = ["snnTorch>=0.8", "cupy-cuda13x>=14.1.1"]

# --- Training infrastructure ---
lightning = ["pytorch-lightning>=2.6.6"]
analysis = ["optuna", "tabulate>=0.9"]

# --- ML/data utilities ---
ml = ["scikit-learn", "pandas", "scipy"]

# --- Terminal rendering (renderer layer; not a core import, see TODO35 §1.4) ---
console = ["rich"]

# --- Plotting & visualization ---
plot = ["matplotlib", "seaborn", "plotly>=6.9.0"]

# --- Deployment & serving ---
deploy = ["fastapi", "uvicorn"]
export = ["onnx", "onnxscript", "onnxruntime"]

# --- Networking ---
p2p = ["kademlia", "grpcio>=1.62", "grpcio-tools>=1.62"]

# --- System monitoring ---
monitoring = ["psutil"]

# --- Existing optional groups ---
knowledgebase = ["gpytorch", "botorch", "sympy"]
graphs = ["torch-geometric>=2.5", "networkx"]
llm = ["openai>=1.0"]

# --- Full install ---
full = [
    "computronium[vision,lm,rl,spiking,lightning,analysis,ml,plot,console,deploy,export,p2p,monitoring,knowledgebase,graphs,llm,nn]",
]

[project.urls]
homepage = "https://github.com/computronium/computronium"
repository = "https://github.com/computronium/computronium"
documentation = "https://computronium.readthedocs.io"

[project.scripts]
comp = "computronium.cli.__main__:main"

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    # The acceptance campaign fixture is shared across xdist workers, so exactly
    # one process may build the store (TODO48b R8). It was already installed
    # transitively; a test that imports a package must declare it.
    "filelock>=3.16",
    "grpcio-tools>=1.83.0",
    "httpx2>=2.12.0",
    "hypothesis>=6.161.2",
    "libcst>=1.9.0",
    "matplotlib>=3.11.1",
    "pip-audit>=2.10.1",
    "plotly>=7.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "selenium>=4.0",
]

[tool.pytest.ini_options]
# tests/acceptance holds U1-U5 — the suite that proves the kernel works. Leaving
# it out means a bare `pytest` has never run the project's central claim (TODO46 D10).
testpaths = ["tests/unit", "tests/property", "tests/primitives", "tests/algorithms", "tests/acceleration", "tests/acceptance"]
# NiceGUI Screen tests register pages in-test; no repo-root main.py (empty →
# get_path_to_main_file returns None and the plugin's in-process ui.run path runs).
main_file = ""
markers = [
    "slow: marks tests as slow (e.g. MNIST full epoch)",
    "gpu: runs on CUDA device; skipped when GPU unavailable",
    "gpu_only: requires CUDA; skipped on CPU-only machines",
    "cpu_only: runs on CPU only; skipped when GPU required",
    "benchmark: performance/parity benchmark producing JSONL",
    "flaky: quarantined non-deterministic test (Sprint 5.6)",
    "llm: requires a real LLM provider; skipped in CI",
    "integration: integration tests requiring external deps or long runtime",
    "demo: gallery demo — trains networks and re-pins docs/figures; run with -m demo",
    "filterwarnings: builtin, registered for --strict-markers compat",
    "timeout: marks tests with a timeout (requires pytest-timeout)",
    "full_multi_axis: run full multi-axis execute_spec (slow)",
    "probe: probe measurement script converted to test; run with -m probe",
]
addopts = "-n 4 --strict-markers --durations=25 -m 'not slow and not benchmark and not llm and not demo' -p no:warnings"
# pytest-timeout is the kill, and its signal method already dumps the stack of
# the test it stops. faulthandler's own 120s dump fired on every test that
# legitimately runs longer than the default -- it printed "Timeout (0:02:00)!"
# for tests that then passed, which reads exactly like the failure it was
# meant to diagnose. A test over the default now carries an explicit
# `@pytest.mark.timeout(...)`; nothing else needed a second clock.
faulthandler_timeout = 0
timeout = 120
timeout_method = "signal"

[tool.coverage.run]
source = ["computronium"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/acceleration/*",
    "*/analysis/*",
    "*/validation/*",
    "*/cli/*",
    "*/experiments/*",
    "*/joint/*",
    "*/plasticity/*",
    "*/tile/*",
    "*/autoscientist/*",
    "*/models/native/*",
]

[tool.ruff]
target-version = "py314"
line-length = 88
preview = true
exclude = ["*.md", "*_pb2.py", "*_pb2_grpc.py", "docs/archive", "docs/generated"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "C9",   # mccabe complexity
    "PLR",  # pylint refactoring
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "RUF",  # ruff-specific
    "S",    # bandit security
    "TCH",  # flake8-type-checking
    "TRY",  # tryceratops
    "ARG",  # flake8-unused-arguments
    "PTH",  # pathlib
    "ERA",  # eradicate
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "SIM",  # flake8-simplify
]
ignore = [
    "line-too-long",   # line-too-long — disabled forever (user directive 2026-09-03): the formatter handles what it can, the rest is noise
    "magic-value-comparison", # magic-value-comparison — numeric research thresholds (0.5, 1e-4, ...) are the domain's first-class objects
    "no-self-use", # no-self-use — protocol implementations keep a uniform method surface (self unused by design)
    "unused-function-argument",  # unused-function-argument — math notation (W, G, V, X) is the domain's naming convention
    "unused-method-argument",  # unused-method-argument — ditto
    "non-lowercase-variable-in-function",    # non-lowercase-variable-in-function — ditto for local math variables
    "invalid-argument-name",    # invalid-argument-name — ditto for argument names, plus Triton's DSL-mandated kernel params (BLOCK_*, *_ptr)
    "raise-without-from-inside-except",    # unnecessary-paren-on-raise-exception — long messages in raise calls are the sanctioned error style (AGENTS.md)
    "raise-vanilla-args",  # raise-vanilla-args — ditto; long descriptive messages stay at the raise site
    "ambiguous-unicode-character-string",  # ambiguous-unicode-character-string — Greek/math symbols (β, θ, ≈) in strings are the domain language
    "ambiguous-unicode-character-docstring",  # ambiguous-unicode-character-docstring — ditto
    "ambiguous-unicode-character-comment",  # ambiguous-unicode-character-comment — ditto
    "float-equality-comparison",  # float-equality-comparison — exact sentinel comparisons (== 0.0, != 2.0) against exactly-assigned configs are load-bearing (bitwise L5 locks)
    "commented-out-code",  # commented-out-code — eradicate false positive on `# ruff: file-ignore[...]` directives in __init__.py
    # Suppression-comment style rules (ruff 0.15 directive family): the repo
    # uses ~1.5k legacy `# ruff: ignore[rule-name]` guard-rail comments;
    # RUF100 marks them unused, RUF105/106 want the other directive form and
    # RUF103 rejects it back. Canonical-form migration is Register C work;
    # enabling these rules only churns guard-rails without lint signal.
    "unused-noqa",  # unused-noqa
    "invalid-suppression-comment",  # invalid-suppression-comment
    # "RUF105",  # noqa-comments — new preview rule prefers `ruff: ignore`; canonical directive migration is Register C
    # "RUF201",  # rule-codes-in-selectors — codes are the enforced canonical selector form (2026-09-16 mid-flight fix)
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "assert",  # assert — demos exit 0 only when the demonstrated property holds
    "typing-only-first-party-import", # demos are scripts: runtime imports keep the dependency explicit
    "typing-only-standard-library-import",
]
"computronium/__init__.py" = [
    "star-arg-unpacking-after-keyword-arg",  # invalid-all-format — undefined-export — __all__ names resolve through the _LAZY import map
]
"computronium/ontology/dynamics/__init__.py" = [
    "mutable-class-default",  # implicit-namespace-package — DYNAMICS_REGISTRY lives beside its classes (R1.1)
    "implicit-optional",  # non-empty-init-module — the registry is the single-source wiring point by design (TODO18 wiring lock)
]
"computronium/acceleration/pc_kernels.py" = [
    "too-many-statements",
]
"computronium/acceleration/{fa_kernels,ff_kernels,hebbian_kernels,kernels,snn_kernels,tile_kernels,triton_kernels,compile,kernel_backend}.py" = [
    # too-many-statements-in-try-clause — guarded Triton import ladder
    "unused-noqa",  # noqa-comments — the noqa is on a guarded import ladder
]
"computronium/acceleration/triton_kernels.py" = [
    "unused-noqa",
    "too-many-arguments", # too-many-arguments — kernel parameter surfaces are wide by design
    "too-many-locals", # too-many-locals — ditto
    "too-many-return-statements", # too-many-positional-arguments — ditto
]
"computronium/acceleration/microbench.py" = ["unused-noqa"]
"computronium/acceleration/backends.py" = ["unused-noqa"]
"computronium/ontology/system.py" = ["collapsible-if"] # collapsible-if — validation clarity over brevity
"computronium/ontology/credit.py" = [
    "unused-method-argument", # unused-method-argument — protocol surface uniformity
    "non-augmented-assignment", "redefined-loop-name",
]
"computronium/ontology/geometry.py" = ["unused-method-argument"]
"computronium/ontology/substrate/_substrate.py" = ["unused-method-argument"]
"computronium/ontology/update.py" = ["unused-method-argument"]
"computronium/state/transitions.py" = ["unused-method-argument"]
"computronium/domains/trainer.py" = [
    "too-many-arguments", # too-many-arguments — trainer config is necessarily wide
    "too-many-return-statements", # too-many-positional-arguments — ditto
    "assert",    # assert — internal invariant guard
]
"computronium/experiment/evidence/store.py" = [
    "unused-noqa",
    "hardcoded-sql-expression",    # hardcoded-sql-expression — parameterized queries by design
]
"computronium/experiment/execution/search_space.py" = [
    "unused-noqa", "module-import-not-at-top-of-file", "typing-only-first-party-import", "typing-only-third-party-import", "typing-only-standard-library-import",
    "too-many-branches", "too-many-statements", "too-many-locals", "too-many-nested-blocks", "unnecessary-generator-set", "unused-variable",
]
"computronium/experiment/execution/stages_impl.py" = [
    "unused-noqa", "module-import-not-at-top-of-file", "typing-only-first-party-import", "typing-only-standard-library-import",
    "too-many-branches", "too-many-statements", "too-many-locals", "complex-structure",
    "suppressible-exception", "reimplemented-builtin", "if-stmt-min-max", "unused-variable",
]
"computronium/experiment/execution/compose.py" = ["unused-noqa"]
"computronium/experiment/execution/policy.py" = []
"computronium/experiment/execution/sysctx.py" = []
"computronium/experiment/execution/optuna_adapter.py" = ["too-many-return-statements", "blanket-type-ignore"]
"computronium/experiment/legality/engine.py" = []
"computronium/experiment/legality/dsl.py" = ["unused-noqa"]
"computronium/experiment/schema/primitives.py" = ["module-import-not-at-top-of-file"]
"computronium/experiment/schema/harvest.py" = ["too-many-branches", "suppressible-exception", "try-consider-else", "redefined-loop-name"]
"computronium/experiment/surface/conformance.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true", "start-process-with-partial-path", "if-else-block-instead-of-if-exp", "unused-variable"]
"computronium/experiment/surface/operations.py" = []
"computronium/experiment/surface/report.py" = ["unused-noqa"]
"computronium/cli/joint_validate.py" = []
"computronium/core/continual/runner.py" = ["too-many-arguments", "too-many-return-statements", "redefined-loop-name", "ambiguous-variable-name"]
"computronium/core/continual/training.py" = ["typing-only-first-party-import", "too-many-locals"]
"computronium/core/local_learning/settling.py" = ["too-many-arguments", "unused-unpacked-variable"]
"computronium/core/presets.py" = ["too-many-statements"]
"computronium/core/substrates/complex_substrate.py" = ["unused-noqa"]
"computronium/core/system_trainer/factory.py" = ["complex-structure"]
"computronium/core/system_trainer/joint.py" = ["too-many-branches"]
"computronium/core/tile/topology.py" = ["too-many-branches", "complex-structure"]
"computronium/data/lm.py" = ["unused-noqa"]
"computronium/deployment/serialization.py" = ["unused-noqa", "multiple-with-statements"]
"computronium/models/deployments/config.py" = ["too-many-arguments"]
"computronium/ontology/dynamics/_dynamics.py" = [
    "non-augmented-assignment",
    "too-many-arguments", "suppressible-exception", "if-else-block-instead-of-if-exp", "unused-noqa",
]
"computronium/p2p/grpc_service.py" = ["unused-noqa"]
"computronium/utils.py" = ["suspicious-subprocess-import", "suppressible-exception"]
"computronium/validation/notebook.py" = ["unused-noqa"]
"computronium/validation/tracks/hardware_tracks.py" = ["non-augmented-assignment"]
"computronium/validation/tracks/_signal_probe.py" = ["unused-noqa"]
"computronium/validation/tracks/signal_tracks.py" = ["unused-noqa"]
"computronium/validation/tracks/track_registry.py" = []
"computronium/validation/verifier.py" = ["too-many-locals", "too-many-statements", "complex-structure", "if-else-block-instead-of-if-exp", "if-stmt-min-max", "in-dict-keys"]
"computronium/ontology/_settle_kernel.py" = [
    "non-augmented-assignment", # non-augmented-assignment — out-of-place adds are the settle graph-safety idiom (R5.3); `+=` on a graph tensor changes autograd semantics
]
"packages/*/tests/**/*.py" = [
    "assert",   # assert in standalone-package tests
]
"scripts/probes/x_*.py" = [
    "unsorted-imports",  # unsorted-imports — module-import-not-at-top-of-file — sys.path bootstrap before computronium imports
    "single-line-implicit-string-concatenation", # single-line-implicit-string-concatenation — import block follows the sys.path insert by design
]
"scripts/{probes/**,audit_*.py}" = [
    # Research probes and the audit_* diagnostics are sanctioned throwaways
    # (AGENTS probe conventions): numbers-in-docstrings matter, lint polish
    # does not. Security rules stay active; these close the style/complexity
    # classes only. Audit scripts keep the explicit rebind form (`x = x * m`,
    # not `x *= m`): the operand is a torch tensor, so `*=` mutates it in
    # place, and the correctness of that depends on the line above staying
    # unaliased -- TODO34 Pass 2 recorded the same decision for the
    # production kernel.
    "assert",    # assert — asserts are the probe's sanity gates
    "hashlib-insecure-hash-function",    # hashlib-insecure-hash-function — md5 for non-cognitive cache keys
    "too-many-return-statements", # too-many-return-statements — complexity budgets don't apply to one-off sweeps
    "too-many-branches", # too-many-branches — ditto
    "too-many-locals", # too-many-locals — ditto
    "too-many-statements", # too-many-statements — ditto
    "global-statement", # global-statement — probe-level module state by design
    "redefined-loop-name", # redefined-loop-name — loop-var overwrite is a common probe idiom
    "redefined-loop-name", # redefined-argument-from-local — manual counters read clearer in sweep loops
    "asyncio-dangling-task",  # asyncio-dangling-task — fire-and-forget probe tasks
    "ambiguous-variable-name",    # ambiguous-variable-name — single-letter math names (l, n) are the domain language
    "unused-variable",    # unused-variable — assignments kept for side effects / future inspection
    "unused-lambda-argument",  # unused-lambda-argument — lambda placeholders in tracker callbacks
    "non-augmented-assignment",  # non-augmented-assignment — ditto; probes accumulate torch tensors out-of-place for the same graph-safety reason
]
"computronium/primitives/substrate/noisy/reference.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/sparse/reference.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/complex/reference.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/ternary/reference.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/geometry/spatial_lattice_3d/reference.py" = [
    "typing-only-first-party-import", # FeedforwardGeometry used in function signature and body; false positive
]
"computronium/primitives/substrate/noisy/kernel.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/sparse/kernel.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/complex/kernel.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"computronium/primitives/substrate/ternary/kernel.py" = [
    "typing-only-first-party-import", # SubstrateSpec used in function signature and body; false positive
]
"tests/**/*.py" = [
    "assert",   # assert in tests
    "suspicious-subprocess-import",   # suspicious-subprocess-import — subprocess CLI smoke / wheel-acceptance tests
    "subprocess-without-shell-equals-true",   # subprocess-without-shell-equals-true — ditto
    "start-process-with-partial-path",   # start-process-with-partial-path — subprocess CLI smoke tests; partial-path executables (uv)
    "suspicious-non-cryptographic-random-usage",   # suspicious-non-cryptographic-random-usage — random.Random in test samplers/fixtures
    "magic-value-comparison", # magic-value-comparison — literal expected values in assertions
]

[tool.ruff.lint.flake8-type-checking]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 9
max-branches = 12
max-locals = 15
max-returns = 6
max-statements = 50
max-positional-args = 9

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
preview = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.hypothesis]
database = {file = ".hypothesis/example.db"}
verbosity = "verbose"
phases = ["generate", "shrink", "explain"]
max_examples = 100
deadline = 500
print_blob = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
