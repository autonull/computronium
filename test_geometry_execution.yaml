meta:
  name: test_geometry
  description: Depth vs width tradeoff, recurrent vs feedforward, attention mechanisms
  hypotheses: []
  tags:
  - geometry
  - topology
  - flagship
  created_at: '2026-10-09T21:21:48.645696'
  version: '1.0'
design:
  design_type: full_factorial
  factors:
    geometry:
      name: geometry
      type: between_subjects
      values:
      - feedforward
      - recurrent
      - causal_transformer
      - tile
    dynamics:
      name: dynamics
      type: between_subjects
      values:
      - energy_minimization
      - predictive_settling
      - instantaneous
  fixed:
    substrate:
      name: substrate
      value: digital
    credit:
      name: credit
      value: gradient
    update:
      name: update
      value: adam
    plasticity:
      name: plasticity
      value: 'null'
  blocks:
  - task: mnist
    epochs: 5
    seeds: 3
    fidelity: L0
    extra: {}
  power_analysis:
    enabled: true
    min_effect_size: 0.5
    required_power: 0.8
    alpha: 0.05
    test_type: paired_t_test
    adaptive: false
    interim_analyses: 0
  generators: []
analysis:
  primary: Validation accuracy vs parameter count per geometry
  secondary:
  - settle_steps
  - stability_margin
  - walltime_total
  stats:
  - cohens_d
  - cliffs_delta
  - bayes_factor
  visualizations:
  - pareto
  - ablation
  - convergence
  multiple_comparison_correction: benjamini_hochberg
  exploratory: false
resources:
  max_wall_hours: 0.05
search_space:
  base: {}
  constraints: []
arms:
  adaptive: {}
hpo:
  sampler: nsga2
  objectives:
  - name: val_acc
    direction: maximize
    weight: 1.0
  - name: param_count
    direction: minimize
    weight: 1.0
  n_trials: 20
  n_startup_trials: 5
  n_seeds: 3
  seed: 42
output:
  db: experiment.db
  artifacts_dir: artifacts
  log_level: INFO
  emit_every: 5
  export_formats:
  - json
  - parquet
reproducibility:
  seed: 42
  capture_env: true
  artifact_hash: true
runs:
- name: main
  profile: production-map
  overrides:
    axes:
    - axis: substrate
      primitives:
      - digital
    - axis: geometry
      primitives:
      - feedforward
      - causal_transformer
      - tile
    - axis: dynamics
      primitives:
      - energy_minimization
      - predictive_settling
      - instantaneous
    - axis: plasticity
      primitives:
      - 'null'
    - axis: credit
      primitives:
      - gradient
    - axis: update
      primitives:
      - adam
    tasks:
    - mnist
    hpo:
      n_trials: 20
