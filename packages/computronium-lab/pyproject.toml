[project]
name = "computronium-lab"
version = "0.1.0"
description = "High-level API over the Computronium 6-axis ontology: compose, train, compare, report."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "computronium",
    "ceec-core",
    "psi-peft",
    "local-feedback",
    "stability",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computronium_lab"]

[tool.hatch.build.targets.wheel.force-include]
"src/computronium_lab/data/icu_measurements.csv" = "computronium_lab/data/icu_measurements.csv"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"