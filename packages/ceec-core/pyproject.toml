[project]
name = "ceec-core"
version = "0.1.0"
description = "Standalone epistemic governance ledger: evidence, beliefs, gates, quarantine, calibration, audit."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0"]

[project.scripts]
ceec = "ceec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceec"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"