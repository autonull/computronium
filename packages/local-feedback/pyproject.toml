[project]
name = "local-feedback"
version = "0.1.0"
description = "Adaptive local feedback projections for local credit assignment (X-ALI-001 validated scope)."
requires-python = ">=3.12"
dependencies = ["torch>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_feedback"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["examples", "benchmarks"]
typeCheckingMode = "strict"