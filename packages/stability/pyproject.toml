[project]
name = "stability"
version = "0.1.0"
description = "Calibrated stability guard for dynamical neural systems: attach-and-check kill-switch with ROC-calibrated thresholds."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["torch>=2.0", "numpy"]

[project.scripts]
stability = "stability.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stability"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"  # repo standard; strict deferred to hygiene pass